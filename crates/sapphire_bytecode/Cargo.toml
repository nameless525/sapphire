[package]
name = "sapphire_bytecode"
description = "Luau bytecode as cooked data: the .sscript format, and the scan that says what a chunk may do."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The compiler, for what cooks a script and what compiles one live. Off, this crate reads bytes and links
# no Luau, which is all the asset server asks of it.
compile = ["dep:mlua"]

[dependencies]
# Cooked data derives `TypePath`, whose derive finds the crate by this name.
bevy_reflect.workspace = true
mlua = { workspace = true, optional = true }
rkyv.workspace = true
sapphire_reflect.workspace = true
sapphire_serialize.workspace = true
thiserror.workspace = true

[lints]
workspace = true
