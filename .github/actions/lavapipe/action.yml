name: Install lavapipe
description: Put Mesa's software Vulkan driver in place for this job, from the cache when there is one.
runs:
  using: composite
  steps:
    # One place names the build: a new Mesa is a new URL and digest here, and so a new cache key.
    - id: mesa
      shell: bash
      run: |
        {
          echo "url=https://github.com/gfx-rs/ci-build/releases/download/build29/mesa-26.1.3-linux-x86_64.tar.xz"
          echo "digest=63915836cf582bdbf13cf41c75ac335f7ec9c8b4886fe32e76b748ff8c6393c6"
          echo "key=mesa-26.1.3-linux-x86_64-63915836cf582bdbf13cf41c75ac335f7ec9c8b4886fe32e76b748ff8c6393c6"
        } >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/mesa.tar.xz
        key: ${{ steps.mesa.outputs.key }}
    # GitHub's release downloads have answered 504 for minutes at a time, so a miss waits up to ten.
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        MESA_URL: ${{ steps.mesa.outputs.url }}
      run: |
        cd "$RUNNER_TEMP"
        curl -sSfL --retry 20 --retry-delay 30 --retry-all-errors --retry-max-time 600 -o mesa.tar.xz "$MESA_URL"
    - shell: bash
      env:
        MESA_DIGEST: ${{ steps.mesa.outputs.digest }}
      run: echo "$MESA_DIGEST  $RUNNER_TEMP/mesa.tar.xz" | sha256sum -c -
    # Saved as soon as it's verified, so a job that fails later still leaves it for the next.
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/mesa.tar.xz
        key: ${{ steps.mesa.outputs.key }}
    - shell: bash
      run: |
        cd "$RUNNER_TEMP"
        mkdir mesa && tar xpf mesa.tar.xz -C mesa
        cat > lavapipe.json <<JSON
        {"file_format_version": "1.0.1", "ICD": {"library_path": "$RUNNER_TEMP/mesa/lib/x86_64-linux-gnu/libvulkan_lvp.so", "api_version": "1.4.348", "library_arch": "64"}}
        JSON
        echo "VK_DRIVER_FILES=$RUNNER_TEMP/lavapipe.json" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/mesa/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
