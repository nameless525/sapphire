[package]
name = "sapphire_pipeline"
description = "Asset pipeline: sidecars, importers, bakers, cookers and the content cache. Never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "sapphire_pipeline"
path = "src/main.rs"

[dependencies]
sapphire_assets.workspace = true
# Collider documents' checks and cooked format. Plain data: the tool links no collision library.
sapphire_colliders.workspace = true
# Names of a move's baked paths.
sapphire_core.workspace = true
# The probe bake lights the sky as the renderer relights it (`sky::sky_radiance`), under time of
# day's keys (M1 W5). Neither crate embeds a shader or the default day, so editing those rebuilds
# nothing here: the bake reads the default day's file itself (`probes::default_day_path`).
sapphire_look.workspace = true
# Color math shared with the runtime (sRGB, OkLab).
sapphire_math.workspace = true
# Move set documents, which cook to what the simulation reads (M2 G2). Plain data: the cooker never
# links the simulation.
sapphire_moves.workspace = true
sapphire_reflect.workspace = true
sapphire_serialize.workspace = true
# The string table's format. Plain data: the cooker links no ICU data but what a tag's check needs.
sapphire_strings.workspace = true
sapphire_tod.workspace = true
sapphire_zone.workspace = true
# Reads `.ftl` sources (M3 V2), in the cooker only.
fluent-syntax.workspace = true
icu_locale_core.workspace = true
anyhow.workspace = true
# `.meta` sidecars derive `TypePath`, whose derive finds the crate by this name.
bevy_reflect.workspace = true
blake3.workspace = true
bytemuck.workspace = true
ctt.workspace = true
getrandom.workspace = true
glam.workspace = true
# Probe grids store half floats (M1 W5).
half.workspace = true
# `extras` exposes per-object custom properties, which is how Blender drives character shading parameters.
# `extensions` exposes extensions gltf doesn't model, which is how VRM files carry theirs (M1 A6).
# `utils` reads accessors; buffers load in `import::gltf` rather than through `import` (which
# vrm-spec's dependency on gltf's defaults builds anyway, see the workspace manifest).
gltf = { workspace = true, features = ["extras", "extensions", "utils", "names"] }
image.workspace = true
meshopt.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# FBX meshes, skins, blend shapes and materials (M1 A10).
ufbx.workspace = true
vrm-spec.workspace = true

[dev-dependencies]
# Spring bones on the character itself, with no GPU and no cook (`tests/character_springs.rs`), and a
# move's tables against the pose on screen. Tests only, like the next: the cooker itself links neither
# (`[cooker]` in xtask/layers.toml looks at normal dependencies).
sapphire_anim.workspace = true
# A move's tables played in the simulation.
sapphire_gameplay.workspace = true
# The editor's sidecars and a cook's are one thing (`tests/document_sidecars.rs`).
sapphire_document.workspace = true

[lints]
workspace = true
