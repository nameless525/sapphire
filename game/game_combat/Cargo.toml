[package]
name = "game_combat"
description = "A fight's app side: the arena, its fighters, the cues they fire and what plays them on a stage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sapphire_anim.workspace = true
sapphire_assets.workspace = true
sapphire_audio.workspace = true
sapphire_camera.workspace = true
sapphire_colliders.workspace = true
sapphire_core.workspace = true
sapphire_cues.workspace = true
sapphire_dialogue.workspace = true
sapphire_ecs.workspace = true
# bevy's `Component` / `Resource` derives resolve the `bevy_ecs` crate by name (see sapphire_ecs).
bevy_ecs.workspace = true
sapphire_gameplay.workspace = true
sapphire_math.workspace = true
sapphire_moves.workspace = true
sapphire_physics.workspace = true
sapphire_input.workspace = true
# A game's restart prepares its run on the warm-up pool (M4 H4).
sapphire_jobs.workspace = true
sapphire_serialize.workspace = true
sapphire_platform.workspace = true
sapphire_render.workspace = true
# Scenarios with a script, and the reload that live tuning brings a script's edits through.
sapphire_script.workspace = true
sapphire_rhi.workspace = true
sapphire_sequencer.workspace = true
sapphire_stage.workspace = true
sapphire_time.workspace = true
sapphire_timeline.workspace = true
# The plain values a fight says of its fighters, which a HUD reads.
sapphire_ui.workspace = true
sapphire_vfx.workspace = true
sapphire_world.workspace = true
# What a zone trip copies, and what starts an encounter, which the stage warms ahead of (M3 W4, W5).
sapphire_zone.workspace = true
profiling.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Documents pushed over live link name their type by its stable name.
sapphire_reflect = { workspace = true, optional = true }
# Live tuning, dev-only (rule R8): linked only by the `dev` feature, which an app's own `dev` turns on.
sapphire_hot_reload = { workspace = true, optional = true }
sapphire_livelink = { workspace = true, optional = true }

[dev-dependencies]
sapphire_reflect.workspace = true
# The tests hold allocations to their budgets, so they count them as an app does.
sapphire_core = { workspace = true, features = ["mimalloc"] }

[features]
# Development builds: live tuning. An app's `dev` forwards it.
dev = ["dep:sapphire_hot_reload", "dep:sapphire_livelink", "dep:sapphire_reflect", "sapphire_stage/dev"]

[lints]
workspace = true
