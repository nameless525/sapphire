# Per-PR checks (spec §8, quality gate 1 in §9). Nightly cooks, golden images, replays
# and device runs join as those systems land.
#
# The toolchain, its components and its targets come from rust-toolchain.toml via
# `rustup toolchain install`, so the pinned version lives in one place. That file can't
# name a per-job subset of targets, so every job installs all seven standard libraries
# (a few seconds each). Actions are pinned to commit SHAs, with the release in a comment;
# Dependabot (.github/dependabot.yml) keeps them current. Runner images are pinned too, so
# an image migration is a deliberate change here, not a surprise.
#
# Minimum OS versions come from .cargo/config.toml [env], which every cargo call reads.
#
# rust-cache saves on failure too (`cache-on-failure`): a failed job has still compiled its
# dependencies, and without it the next run of that job starts cold.
#
# `cargo --locked xtask --locked …`: the first flag locks the build of xtask itself, the
# second makes xtask pass --locked to every cargo command it runs.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in CI builds: nothing debugs them, and it is a large share of compile and link
  # time (PDB generation on Windows above all) and of the cache. Panics still name functions.
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: short
  # SDL 3 is built from source (sapphire_platform). Ubuntu build dependencies from SDL's
  # docs/README-linux.md: the "all features" list plus its Ubuntu 22.04+ additions.
  SDL3_LINUX_DEPS: >-
    build-essential pkg-config cmake ninja-build
    libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
    libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev
    libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev
    libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev
    liburing-dev
  # The C and C++ dependencies (SDL, mimalloc, Tracy) build differently per runner image
  # and macOS SDK, so both join rust-cache's key on top of its defaults. The `env` context
  # doesn't see runner variables such as ImageOS, so they go in by name rather than `key:`.
  RUST_CACHE_ENV_VARS: CARGO CC CFLAGS CXX CMAKE RUST ImageOS SDKROOT

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL3 build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SDL3_LINUX_DEPS
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Optional features (`tracy`, `mimalloc`) only compile when enabled.
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Rustdoc with warnings denied: every intra-doc link resolves, private items' docs included
      # (the renderer documents its passes on internal modules), and public docs link to public
      # items only. The second build adds the sandbox's `dev` half, and documents only the sandbox
      # again; the first keeps links to dev-only items out of the docs every build has.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --locked --document-private-items
          cargo doc --workspace --no-deps --locked --document-private-items --features sapphire_sandbox/dev
      - name: Crate layering (R1, R8)
        run: cargo --locked xtask --locked check-layers
      - name: Licenses, bans, advisories, sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux binaries built on ubuntu-24.04 need its glibc (2.39). Spec §2's floor is
        # Ubuntu 22.04-era glibc, so `xtask package` (M4) must build Linux releases in an
        # older sysroot, such as the Steam Runtime SDK container.
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL3 build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SDL3_LINUX_DEPS
      # SDL's CMake build for macOS needs the SDK named explicitly with some Xcode and
      # Command Line Tools combinations; cargo xtask does the same locally.
      - name: Select the macOS SDK
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          cache-on-failure: true
      # --no-fail-fast: one failing crate shouldn't hide the results of the rest.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  # Golden images (spec §9 gate 3, M1 plan Q6): sandbox captures compared with per-backend
  # references in tests/golden by `cargo xtask golden`. Each runner renders with a pinned CPU or
  # paravirtual GPU, so a backend family's images don't drift with runner-image updates.
  #
  # The CPU rasterizers split their scenes across runners (`--shard <index>/<count>`, every
  # count-th scene), each shard building the sandbox on its own. Since the light clusters and the
  # sky's projection stopped looping over workgroup barriers (#56, #58), WARP no longer spends
  # minutes on a scene: at 86 scenes, each of WARP's four shards takes 10–15 minutes with its
  # build, and each of lavapipe's two 8–14. The slowest job sets how soon a change can land, so
  # add shards as scenes are added, keeping each job well inside its time limit.
  golden:
    name: Golden images (${{ matrix.family }} ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, family: vulkan-lavapipe, backend: vulkan, shard: 1, shards: 2 }
          - { os: ubuntu-24.04, family: vulkan-lavapipe, backend: vulkan, shard: 2, shards: 2 }
          - { os: windows-2025, family: dx12-warp, backend: dx12, shard: 1, shards: 4 }
          - { os: windows-2025, family: dx12-warp, backend: dx12, shard: 2, shards: 4 }
          - { os: windows-2025, family: dx12-warp, backend: dx12, shard: 3, shards: 4 }
          - { os: windows-2025, family: dx12-warp, backend: dx12, shard: 4, shards: 4 }
          - { os: macos-26, family: metal, backend: metal, shard: 1, shards: 1 }
    runs-on: ${{ matrix.os }}
    # Metal on the hosted runner's paravirtual GPU is informational until it has run clean
    # for two weeks; wgpu itself still tests on macos-14 (M1 plan §3).
    continue-on-error: ${{ matrix.family == 'metal' }}
    timeout-minutes: 45
    env:
      SAPPHIRE_GPU_BACKEND: ${{ matrix.backend }}
      # Validation slows CPU rasterizers, and Metal's is broken on the paravirtual device.
      SAPPHIRE_GPU_DEBUG: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL3 build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SDL3_LINUX_DEPS libvulkan1
      # Mesa's lavapipe, pinned to the build wgpu's CI uses rather than apt's, whose updates
      # would change the goldens. The checksum guards the third-party release asset.
      - name: Install lavapipe (Mesa 26.1.3)
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 5 -o mesa.tar.xz https://github.com/gfx-rs/ci-build/releases/download/build29/mesa-26.1.3-linux-x86_64.tar.xz
          echo "63915836cf582bdbf13cf41c75ac335f7ec9c8b4886fe32e76b748ff8c6393c6  mesa.tar.xz" | sha256sum -c -
          mkdir mesa && tar xpf mesa.tar.xz -C mesa
          cat > lavapipe.json <<JSON
          {"file_format_version": "1.0.1", "ICD": {"library_path": "$RUNNER_TEMP/mesa/lib/x86_64-linux-gnu/libvulkan_lvp.so", "api_version": "1.4.348", "library_arch": "64"}}
          JSON
          echo "VK_DRIVER_FILES=$RUNNER_TEMP/lavapipe.json" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/mesa/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Select the macOS SDK
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          cache-on-failure: true
      - name: Build the sandbox
        run: cargo build --package sapphire_sandbox --locked
      # WARP from NuGet, pinned and placed next to the executable so D3D12 loads it instead
      # of the runner's system copy. Its license allows testing only, so it's downloaded here
      # and never committed.
      - name: Install WARP 1.0.21
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -sSfL --retry 5 -o warp.zip https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.21/microsoft.direct3d.warp.1.0.21.nupkg
          if ((Get-FileHash warp.zip -Algorithm SHA256).Hash -ne "EA44B77EB30EEC14427193E20F40CDB2E4C31ED11AB39CB880538FDF4BAC2681") { throw "WARP package checksum mismatch" }
          tar.exe -xf warp.zip build/native/bin/x64/d3d10warp.dll
          Copy-Item build/native/bin/x64/d3d10warp.dll target/debug/
      # Each scene has a deadline (the testkit's --scene-timeout, 900 s by default): a hung scene
      # fails with the end of its log and the rest still run. The sandbox's output for each scene
      # is in target/golden/<scene>.log, and every scene's time in target/golden/timings.json.
      - name: Golden images
        run: cargo --locked xtask --locked golden --shard ${{ matrix.shard }}/${{ matrix.shards }}
      # When a scene fails, what explains a crash goes up with the captures: the sandbox's
      # minidumps (its crash capture writes them under the platform's cache directory) with the
      # Windows executable's debug info, gathered also when the job is cancelled (as one past its
      # time limit is), and the first scene re-run with the backend's validation on and every
      # frame graph pass submitted on its own (`--serial-passes`), whose debug log names the pass a
      # GPU crash or device loss comes from. The replay runs on failure only: a new push cancels a
      # PR's run in progress, where replaying would cost every golden job minutes, and a hung scene
      # now fails at its deadline rather than running the job out of time. Each step has its own
      # time limit, so a replay that hangs as well still leaves time for the upload.
      - name: Gather crash diagnostics
        if: failure() || cancelled()
        timeout-minutes: 2
        shell: bash
        run: |
          out=target/golden/crashes
          mkdir -p "$out"
          case "$RUNNER_OS" in
            Windows) cache="$(cygpath -u "$LOCALAPPDATA")" ;;
            macOS) cache="$HOME/Library/Caches" ;;
            *) cache="${XDG_CACHE_HOME:-$HOME/.cache}" ;;
          esac
          cp -R "$cache/Sapphire/Sapphire Sandbox/crashes/." "$out/" 2>/dev/null || echo "no crash reports"
          cp target/debug/sapphire_sandbox.pdb "$out/" 2>/dev/null || true
      - name: Replay the first scene with serial passes
        if: failure()
        timeout-minutes: 5
        shell: bash
        run: |
          out=target/golden/crashes
          mkdir -p "$out"
          # Metal's validation is broken on the paravirtual device (above).
          debug=validation
          content="$PWD/target/content/desktop"
          case "$RUNNER_OS" in
            Windows) content="$(cygpath -w "$content")" ;;
            macOS) debug=none ;;
          esac
          SAPPHIRE_GPU_DEBUG=$debug SAPPHIRE_CONTENT_DIR="$content" target/debug/sapphire_sandbox \
            --capture "$out/serial-passes.png" --size 640x360 --capture-ticks 0 --plain-post --plain-sky \
            --aa msaa --serial-passes > "$out/serial-passes.log" 2>&1 \
            || echo "the serial-passes run failed with exit code $?"
          tail -n 30 "$out/serial-passes.log"
      # Every run keeps its captures briefly, not just failing ones, so drift within the gates
      # (shader codegen rounding on llvmpipe, say) can be re-baselined from a passing run. The
      # scenes' logs and times go up with them.
      - name: Upload captures and diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-${{ matrix.family }}-${{ matrix.shard }}of${{ matrix.shards }}
          path: target/golden/
          if-no-files-found: ignore
          retention-days: 7

  mobile-build-ios:
    name: Mobile build (iOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      # No SDKROOT here: these builds target the iOS SDKs, which cargo and CMake pick.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          cache-on-failure: true
      # Release with LTO, the configuration that ships: thin LTO once dropped a symbol SDL needed
      # (`___isPlatformVersionAtLeast`, see sapphire_platform/build.rs) and only release links failed.
      - name: Build for device (release)
        run: cargo build --package sapphire_sandbox --target aarch64-apple-ios --release --locked
      - name: Build for simulator
        run: cargo build --package sapphire_sandbox --target aarch64-apple-ios-sim --locked

  mobile-build-android:
    name: Mobile build (Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          cache-on-failure: true
      # Validates the committed Gradle wrapper and caches Gradle's downloads. The basic
      # (MIT) cache provider: the default one is proprietary and a preview for private repos.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # xtask owns the NDK environment, the cdylib build, the mobile cook and the Gradle
      # build (spec §7.3). The image provides the SDK (ANDROID_HOME), JDK 17 and NDK r29.
      # Its default ANDROID_NDK_HOME is r27, older than the r28+ that 16 KB page alignment
      # needs (spec §6.7), so point at the preinstalled r29 that local builds use.
      - name: Bundle the APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" JAVA_HOME="$JAVA_HOME_17_X64"
          cargo --locked xtask --locked bundle --platform android
