[package]
name = "game_ui"
description = "The game's interface: a fight's HUD and its touch zones."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# A screen's model is any reflected value.
bevy_reflect.workspace = true
game_combat.workspace = true
sapphire_assets.workspace = true
sapphire_gameplay.workspace = true
sapphire_loc.workspace = true
sapphire_look.workspace = true
sapphire_math.workspace = true
sapphire_moves.workspace = true
sapphire_platform.workspace = true
sapphire_render.workspace = true
sapphire_stage.workspace = true
sapphire_time.workspace = true
sapphire_ui.workspace = true
tracing.workspace = true

[dev-dependencies]
sapphire_colliders.workspace = true
sapphire_controls.workspace = true
# The counting allocator, for the steady-state allocation test.
sapphire_core = { workspace = true, features = ["mimalloc"] }
sapphire_cues.workspace = true
sapphire_input.workspace = true
sapphire_vfx.workspace = true

[features]
# Development builds: an app's `dev` forwards it to the fight.
dev = ["game_combat/dev"]

[lints]
workspace = true
