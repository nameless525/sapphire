[package]
name = "sapphire_render"
description = "Sapphire's renderer: toon character shading with clustered or per-object local lights, inverted-hull outlines, sky gradient, HDR bloom and grading."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
glam.workspace = true
profiling.workspace = true
sapphire_assets.workspace = true
# The device class (`target::FormFactor`) that render defaults are chosen by.
sapphire_core.workspace = true
sapphire_jobs.workspace = true
sapphire_rhi.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# The headless example writes a PNG. Dev-only, so it never reaches the runtime tree.
png.workspace = true
# Waits on error scopes in the GPU tests.
pollster.workspace = true
# Cooks the textures the GPU tests upload. Tools may be dev-dependencies (xtask check-layers).
sapphire_pipeline.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
