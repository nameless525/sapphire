# Sapphire engine workspace (virtual manifest).
#
# Layering is enforced by `cargo xtask check-layers` against `xtask/layers.toml`.
# See docs/engine-spec.md §4.1 and docs/adr/0001-crate-layering.md.

[workspace]
resolver = "3"
members = [
    # L0 foundation (pure Rust, no OS windowing)
    "crates/sapphire_core",
    "crates/sapphire_math",
    # L1 platform and system
    "crates/sapphire_platform",
    "crates/sapphire_jobs",
    "crates/sapphire_time",
    "crates/sapphire_crash",
    # L2 services
    "crates/sapphire_assets",
    "crates/sapphire_ecs",
    "crates/sapphire_look",
    "crates/sapphire_moves",
    "crates/sapphire_reflect",
    "crates/sapphire_rhi",
    "crates/sapphire_serialize",
    "crates/sapphire_colliders",
    "crates/sapphire_synthetic_zone",
    "crates/sapphire_zone",
    "crates/sapphire_strings",
    "crates/sapphire_loc",
    "crates/sapphire_nav",
    "crates/sapphire_navmesh",
    "crates/sapphire_timeline",
    "crates/sapphire_dialogue",
    # L3 subsystems
    "crates/sapphire_anim",
    "crates/sapphire_body_pose",
    "crates/sapphire_input",
    "crates/sapphire_render",
    "crates/sapphire_tod",
    "crates/sapphire_physics",
    "crates/sapphire_audio",
    "crates/sapphire_vfx",
    "crates/sapphire_text",
    "crates/sapphire_ui",
    # L4 framework
    "crates/sapphire_world",
    "crates/sapphire_gameplay",
    "crates/sapphire_bytecode",
    "crates/sapphire_script",
    "crates/sapphire_camera",
    "crates/sapphire_sequencer",
    "crates/sapphire_save",
    # L5 what any game stands on
    "crates/sapphire_controls",
    "crates/sapphire_cues",
    "crates/sapphire_stage",
    # L6 the game
    "game/game_app",
    "game/game_combat",
    "game/game_flow",
    "game/game_ui",
    # Dev-only: development builds, through an app's `dev` feature
    "crates/sapphire_debug",
    "crates/sapphire_hot_reload",
    "crates/sapphire_watch",
    "crates/sapphire_livelink",
    # Apps
    "apps/sapphire_sandbox",
    # Tools (never shipped)
    "tools/sapphire_document",
    "tools/sapphire_editor",
    "tools/sapphire_pipeline",
    "tools/sapphire_replay",
    "tools/sapphire_soundgen",
    "tools/sapphire_testkit",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
# --- Text (M3 U1) ---
# No system fonts: `system` is what would pull CoreText, fontconfig and DirectWrite.
parley = { version = "0.12", default-features = false, features = ["std"] }
swash = "0.2"
etagere = "0.3"
epaint_default_fonts = "0.37"
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
# Font subsetting: tools only, a second fontations line the runtime must never link.
skera = "0.9"
read_fonts_for_skera = { package = "read-fonts", version = "0.46", default-features = false, features = ["std"] }
# Glyph outlines for the display text's distance fields (M3 U8), on `skera`'s fontations line, so tools only.
skrifa_for_skera = { package = "skrifa", version = "0.49", default-features = false, features = ["std"] }
# Multi-channel signed distance fields for display text, cooked (M3 U8): tools only, since it brings
# `nalgebra` and `image`.
fdsm = "0.8"
# --- Sapphire crates ---
sapphire_core = { path = "crates/sapphire_core" }
sapphire_math = { path = "crates/sapphire_math" }
sapphire_platform = { path = "crates/sapphire_platform" }
sapphire_jobs = { path = "crates/sapphire_jobs" }
sapphire_time = { path = "crates/sapphire_time" }
sapphire_crash = { path = "crates/sapphire_crash" }
sapphire_assets = { path = "crates/sapphire_assets" }
sapphire_ecs = { path = "crates/sapphire_ecs" }
sapphire_look = { path = "crates/sapphire_look" }
sapphire_moves = { path = "crates/sapphire_moves" }
sapphire_reflect = { path = "crates/sapphire_reflect" }
sapphire_rhi = { path = "crates/sapphire_rhi" }
sapphire_serialize = { path = "crates/sapphire_serialize" }
sapphire_anim = { path = "crates/sapphire_anim" }
sapphire_body_pose = { path = "crates/sapphire_body_pose" }
sapphire_input = { path = "crates/sapphire_input" }
sapphire_render = { path = "crates/sapphire_render" }
sapphire_tod = { path = "crates/sapphire_tod" }
sapphire_colliders = { path = "crates/sapphire_colliders" }
sapphire_synthetic_zone = { path = "crates/sapphire_synthetic_zone" }
sapphire_zone = { path = "crates/sapphire_zone" }
sapphire_strings = { path = "crates/sapphire_strings" }
sapphire_loc = { path = "crates/sapphire_loc" }
sapphire_nav = { path = "crates/sapphire_nav" }
sapphire_navmesh = { path = "crates/sapphire_navmesh" }
sapphire_timeline = { path = "crates/sapphire_timeline" }
sapphire_dialogue = { path = "crates/sapphire_dialogue" }
sapphire_physics = { path = "crates/sapphire_physics" }
sapphire_audio = { path = "crates/sapphire_audio" }
sapphire_vfx = { path = "crates/sapphire_vfx" }
sapphire_text = { path = "crates/sapphire_text" }
sapphire_ui = { path = "crates/sapphire_ui" }
sapphire_world = { path = "crates/sapphire_world" }
sapphire_gameplay = { path = "crates/sapphire_gameplay" }
sapphire_bytecode = { path = "crates/sapphire_bytecode" }
sapphire_script = { path = "crates/sapphire_script" }
sapphire_camera = { path = "crates/sapphire_camera" }
sapphire_sequencer = { path = "crates/sapphire_sequencer" }
sapphire_save = { path = "crates/sapphire_save" }
sapphire_controls = { path = "crates/sapphire_controls" }
sapphire_cues = { path = "crates/sapphire_cues" }
sapphire_stage = { path = "crates/sapphire_stage" }
game_combat = { path = "game/game_combat" }
game_flow = { path = "game/game_flow" }
game_ui = { path = "game/game_ui" }
sapphire_debug = { path = "crates/sapphire_debug" }
# Its default `notify` feature is for its own tests: apps turn it on per target.
sapphire_hot_reload = { path = "crates/sapphire_hot_reload", default-features = false }
# The generic watcher stays independent of renderer contents for live-link tool iteration.
sapphire_watch = { path = "crates/sapphire_watch", default-features = false }
sapphire_livelink = { path = "crates/sapphire_livelink" }

# --- Foundation ---
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc"] }
# 0.33 is the line bevy_reflect 0.20 reflects (`glam` feature, `^0.33.2`), so engine math types can
# be reflected directly (M1 F1). Moves with Bevy, between milestones.
glam = "0.33.12"
libm = "0.2.16"
thiserror = "2.0"
anyhow = "1.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Luau, with no JIT and its C++ built from source through `cc` (spec §5.24). `send` so a VM can sit in a
# combat system, which bevy holds to `Send + Sync`.
mlua = { version = "0.12", default-features = false, features = ["luau", "send"] }
bumpalo = "3.20"
slotmap = "1.1"
libc = "0.2"
# Mach's task calls and structs on macOS and iOS, which `libc` lacks: `sapphire_platform`'s process memory.
mach2 = "0.6"
mimalloc = { version = "0.1.52", default-features = false }

# --- Logging and profiling ---
# No default features: nothing uses `#[instrument]`, and `attributes` costs a proc-macro build.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# `filter::Targets` covers `target=level` filters without `env-filter`'s regex engine.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }
# No default features: only `scope!` and `finish_frame!` are used, not the proc-macro attributes.
# Tracy comes in through the sandbox's `tracy` feature (`profiling/profile-with-tracy`).
profiling = { version = "1.0.18", default-features = false }
# Bridges `log` records (wgpu, naga, SDL wrappers) into tracing.
tracing-log = { version = "0.2.0", default-features = false, features = ["log-tracer", "std"] }

# --- Platform ---
# Pinned exactly (SDL 3.4.18; sdl3-sys pins its sdl3-src): sapphire_platform's iOS loop calls SDL's
# internal main-callback functions, so an SDL upgrade, patch releases included, is a deliberate step
# that re-checks them (ADR 0003, and the version assertion in `ios_loop.rs`).
sdl3-sys = { version = "=0.7.2", default-features = false }
raw-window-handle = "0.6.2"
# iOS frame pacing (M1 F7, ADR 0003): sapphire_platform's display link and the class it calls.
# Both were already in the tree through wgpu's Metal backend, at these versions.
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }

# --- ECS (spec §5.6) ---
# Pinned per milestone and re-exported through sapphire_ecs. Its `bevy_reflect` feature
# (ReflectComponent) waits for the inspector (M1 F5), and `backtrace` stays off (error backtraces
# are captured by sapphire_crash instead).
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "multi_threaded", "async_executor"] }

# --- Reflection and serialization (spec §5.8, §5.9) ---
# Pinned with bevy_ecs. Automatic registration (`inventory`) is off: types are registered
# explicitly.
bevy_reflect = { version = "0.20.1", default-features = false, features = ["std", "glam"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.12.2"
# Cooked data: little-endian, aligned, 32-bit relative pointers (rkyv's defaults), validated
# with bytecheck.
rkyv = "0.8.18"
# rkyv's little-endian primitives, already in its tree. `bytemuck-1` makes them `Pod`, so
# archived arrays (cooked mesh indices) upload to the GPU as they lie, without a copy.
rend = { version = "0.5.4", default-features = false, features = ["bytemuck-1"] }
# IEEE half floats for packed data (cooked morph deltas). Already in the runtime tree via naga.
half = { version = "2.7.1", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

# --- Localization (spec §5.25, M3 V2) ---
# Plurals and numbers, with their baked data. Unicode-3.0, admitted in deny.toml. `icu_locale_core`
# and `writeable` are already theirs, and `fixed_decimal` their input type's home.
icu_decimal = "2.4.0"
icu_locale_core = { version = "2.4.0", features = ["alloc"] }
icu_plurals = "2.4.0"
writeable = "0.6.4"
# Reads `.ftl` sources in the cooker only: the runtime reads cooked tables (`fluent`'s own bundles
# can't be cooked, because `FluentResource::try_new` takes a `String`).
fluent-syntax = "0.12.0"

# --- Assets and content (spec §5.10, §5.27) ---
# The pipeline's content-cache keys, and the pack format's block, asset and table-of-contents
# hashes in sapphire_assets (M1 A4). Its SIMD kernels (NEON on phones) build with the C compiler
# SDL's build already needs.
blake3 = "1.8.7"
# Pack blocks compressed for most data (M1 A4): the reference C library, built with cc for every
# target (the tools already built it, through ctt). Chosen over the pure-Rust `ruzstd` on
# measurements (M5, one core, 64 KB blocks of cooked meshes and BC7/ASTC textures): it decodes
# 1.0–1.3 GB/s against ruzstd 0.9's 0.27–0.35 GB/s, so a Mobile-Low zone load would be bound by
# decoding rather than flash reads, and ruzstd's encoder stops at its fastest level (ratio 0.57
# against level 19's 0.37 on the mannequin). Blocks are blake3-verified before they are
# decoded, so corruption never reaches the decoder; hostile packs are ruled out by signed packs
# (M4), and until then meet libzstd's own checks on malformed frames. No default features: no
# legacy formats, no dictionary builder.
zstd = { version = "0.14.3", default-features = false }
# The release manifest's signature (M4 P1, m4-plan §3 "What's signed"): ed25519, checked with
# `verify_strict`. BSD-3-Clause, pure Rust. No default features: the runtime only verifies, so it
# leaves out `fast`'s precomputed tables; the pipeline, which signs, adds `zeroize`.
ed25519-dalek = { version = "3.0.0", default-features = false }
# Pack blocks that must decode fast (M1 A4): pure Rust with no unsafe code (`safe-*`), 4–5.5 GB/s
# decoding on the M5. Block format only: no frame format, so no xxhash.
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
# KTX2, the cooked texture container (M1 A2): sapphire_assets reads and writes it (the pipeline
# writes through it). Its only dependency is bitflags; ctt uses the same version.
ktx2 = "0.5.0"

# --- Physics (spec §5.14) ---
# Geometry only, and never with `enhanced-determinism`: that feature turns on glam's `scalar-math`
# and `libm`, and Cargo unifies features on the workspace's one glam, so `Vec4`, `Quat` and `Mat4`
# would lose their alignment and the renderer its goldens (M2 D3). These features leave glam's
# behavior alone: `nostd-libm` does nothing beside `std`, and `approx` only adds trait impls.
parry3d = { version = "0.31.1", default-features = false, features = ["required-features", "std", "alloc"] }

# --- Navigation (spec §5.19) ---
# Bakes tiles in the cooker. Never with its `libm` or `nostd-libm` feature: each names glam's own, and
# Cargo unifies features on the workspace's one glam (the same trap as `enhanced-determinism`, M2 D3).
# Before bumping it: `nav_bake`'s `rerecast_is_the_version_this_module_was_read_against` says what to do.
rerecast = { version = "=0.5.0", default-features = false, features = ["std"] }

# --- Jobs ---
bevy_tasks = { version = "0.20.0", features = ["multi_threaded"] }
# Windows-only CPU topology queries (P-core / E-core detection) in sapphire_jobs.
windows-sys = { version = "0.61.2", default-features = false }

# --- Crash reporting ---
crash-handler = "0.8.1"
minidumper = "0.11.0"

# --- GPU ---
# GLES and WebGPU backends are deliberately off: Android requires Vulkan 1.1 (spec §2).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12"] }
pollster = "1.0"
# PNG output for the sandbox's offscreen captures.
png = "0.18"
# Dev-only in sapphire_rhi: a detached CAMetalLayer lets it test surfaces without a window. On iOS,
# sapphire_platform's display link (M1 F7) adds the features it needs.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }

# --- Audio (spec §5.15, m2-plan §3, Q8) ---
# The mixer. No default features: its `cpal` backend can't pause a stream and unwraps a restart that
# fails, so `sapphire_audio` connects kira's public renderer to cpal itself; its symphonia decoders
# (MPL-2.0) stay out too, since `lewton` decodes Vorbis.
kira = { version = "0.12.6", default-features = false }
# The audio device layer: CoreAudio, WASAPI, ALSA, AAudio. `realtime` asks Android for AAudio's
# low-latency path and raises the audio thread's priority on Windows; it brings
# `audio_thread_priority` (MPL-2.0, excepted in deny.toml).
cpal = { version = "0.18.2", features = ["realtime"] }
# Pure Rust Ogg Vorbis decoding, no unsafe code, MIT or Apache-2.0: the cooker's check and the
# runtime's decode are the same code (`sapphire_assets::sound`).
lewton = { version = "0.10.2", default-features = false, features = ["ogg"] }
# Ogg Vorbis encoding, for the placeholder music and voice `sapphire_soundgen` makes (M3 A1): libvorbis
# (aoTuV), BSD-3-Clause, built from source by its -sys crates. A tool's only. `stream-serial-rng` is off,
# since a random stream serial would change the bytes each run.
vorbis_rs = { version = "0.5.6", default-features = false }
# iOS's audio session and its interruptions (`sapphire_platform`). In the tree through cpal.
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }
block2 = "0.6"
# What cpal's Android host reads the activity through, which SDL's entry never sets, and the JNI
# calls that fill it in (`sapphire_platform`). In the tree through cpal.
ndk-context = "0.1.1"
jni-sys = "0.4.1"

# --- Dev tooling (dev-only crates: never in a shipping build) ---
# The debug overlay (spec §5.20). `default_fonts` embeds egui's fonts, the overlay's only font
# source; their licenses are excepted in deny.toml.
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
# Built on wgpu 30, the workspace's. Default features off: they turn on wgpu's default and WebGL
# backends, which the engine keeps off (spec §2).
egui-wgpu = { version = "0.37.0", default-features = false }
# Desktop hot reload (spec §5.10, M1 A8): file watching, FSEvents on macOS (the default
# `macos_fsevent`), inotify on Linux, ReadDirectoryChangesW on Windows. sapphire_hot_reload
# debounces its events itself. Only that crate's `notify` feature reaches it, which apps turn on
# for desktop targets: phones and shipping builds never build it.
notify = "8.2.0"

# --- Tests ---
# Pose snapshots (spec §5.13). No default features: its `colors` only colors a failing diff.
insta = { version = "1.47", default-features = false }
# Drives the timeline editor's interface with no window (M2 T3). No `wgpu` feature: it would turn on
# wgpu's GLES backend for every test build of the workspace, and the editor rasterizes its own captures.
egui_kittest = { version = "0.37.0", default-features = false }
# The editor's docking (M3 E2): on the egui above.
egui_tiles = "0.18.0"

# --- Tools only (never in a runtime crate's dependency tree) ---
sapphire_document = { path = "tools/sapphire_document" }
sapphire_testkit = { path = "tools/sapphire_testkit" }
sapphire_pipeline = { path = "tools/sapphire_pipeline" }
# FLIP image comparison for golden images (NVIDIA's FLIP via C++), as wgpu's own tests use.
nv-flip = "0.1.2"
gltf = { version = "1.4.1", default-features = false }
# pixiv's serde types for VRM 1.0 (VRMC_vrm, VRMC_materials_mtoon, VRMC_springBone) and VRM 0.x
# (M1 A6). `gltf_index`, which types indices as gltf's, is required: the crate doesn't build
# without it. `rustc_hash` is off; the importer sorts whatever it reads from the crate's maps.
# It depends on gltf with gltf's default features, so gltf's `import` (base64, urlencoding and
# image's PNG and JPEG decoders) is built too, though the pipeline loads buffers itself.
vrm-spec = { version = "0.1.1", default-features = false, features = ["gltf_index"] }
# FBX import (M1 A10, spec §5.27): bindings to ufbx, a single C file built with cc (already in the
# tree through blake3 and zstd). MIT or Unlicense. No default features to turn off; `mint` stays off.
ufbx = "0.11.5"
# Texture compression (M1 A2, spec §5.27). Only the encoders the cooks use: bc7enc-rdo for BC7,
# Intel's ISPC kernels (prebuilt, so no ISPC toolchain is needed) for BC4, BC5 and BC6H, and
# astcenc for ASTC. No `rayon`: every surface encodes serially, so output never depends on the
# thread count.
ctt = { version = "0.6.1", default-features = false, features = ["encoder-bc7enc", "encoder-intel", "encoder-astcenc", "ispc-prebuilt"] }
# PNG, TGA and EXR decoding for the texture importer, and JPEG for the images VRM files embed
# (M1 A6: decoded for outline-width masks, and written out as PNG sources by extract-materials).
# No `rayon`, no other formats.
image = { version = "0.25.10", default-features = false, features = ["png", "tga", "exr", "jpeg"] }
# meshoptimizer (C++, MIT, built with `cc`): vertex-cache, overdraw and vertex-fetch
# optimization and LOD simplification in the mesh cook (spec §5.27).
meshopt = "0.7.0"
# OS entropy for new asset IDs: only the pipeline creates them. Not on the tool-only list, because
# runtime crates may still reach it through other dependencies (rustls's `ring`, for one).
getrandom = "0.4.3"
serde_json = "1.0"
toml = "1.1"
cargo_metadata = "0.23"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

# A lone backtick pairs with the next one in the paragraph and garbles the rendered docs.
[workspace.lints.rustdoc]
unescaped_backticks = "warn"

# Dependencies fast, our code debuggable (spec §7.2).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Internal profiling builds.
[profile.release]
lto = "thin"
debug = "line-tables-only"

# Offline tools need optimized cooking without repeating whole-program optimization on every
# edit. A separate output directory keeps tool iteration from invalidating app release builds.
[profile.tools]
inherits = "release"
lto = false
# Local importer edits reuse optimized code; CI keeps CARGO_INCREMENTAL=0.
incremental = true

# Store builds: symbols are split out, uploaded, then stripped.
[profile.shipping]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "full"
split-debuginfo = "packed"
