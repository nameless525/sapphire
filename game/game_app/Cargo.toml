[package]
name = "game_app"
description = "The game: a title that opens the arena's fight."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# App identity for `cargo xtask bundle` and `run --app game_app` on every platform; the version is the
# package version above.
[package.metadata.sapphire]
# Apple bundle identifier and Android application id.
bundle-id = "dev.sapphire.game"
# Bundle, APK and directory name, and CFBundleName (at most 15 characters).
bundle-name = "SapphireGame"
display-name = "Sapphire"
# CFBundleVersion and Android versionCode: raise it with every store or TestFlight upload.
build = 1

# The library holds the app. Desktop and iOS link it into the `game_app` binary; Android builds it as a
# cdylib (`cargo rustc --crate-type cdylib`, driven by xtask) whose exported `SDL_main` SDLActivity calls.
[lib]
path = "src/lib.rs"

[[bin]]
name = "game_app"
path = "src/main.rs"

[dependencies]
game_combat.workspace = true
game_ui.workspace = true
sapphire_controls.workspace = true
sapphire_core = { workspace = true, features = ["mimalloc"] }
sapphire_crash.workspace = true
# The showcase the character screen's inset stands, which the scene names by entity.
sapphire_ecs.workspace = true
sapphire_gameplay.workspace = true
sapphire_input.workspace = true
sapphire_jobs.workspace = true
sapphire_math.workspace = true
sapphire_platform.workspace = true
sapphire_render.workspace = true
sapphire_rhi.workspace = true
sapphire_save.workspace = true
sapphire_stage.workspace = true
sapphire_time.workspace = true
sapphire_ui.workspace = true
png.workspace = true
profiling.workspace = true
tracing.workspace = true

[dev-dependencies]
sapphire_assets.workspace = true
sapphire_loc.workspace = true
sapphire_math.workspace = true
sapphire_serialize.workspace = true

[features]
# What the crates under it have for development builds. The game adds no tools of its own.
dev = ["sapphire_stage/dev", "game_combat/dev", "game_ui/dev"]

# A caller outside the crate, on the platform's real loop, which must own the process's main thread.
[[test]]
name = "reaches_the_fight"
harness = false

[lints]
workspace = true
