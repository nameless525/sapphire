[package]
name = "sapphire_editor"
description = "The editor: a docked shell over `sapphire_document`, with the combat timeline, an asset browser, a reflection inspector and a cvar panel, saved as text and pushed over live link. Desktop only, never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "sapphire_editor"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bevy_reflect.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
# The panes' docking.
egui_tiles.workspace = true
# The viewport stands the game's fight, as the game does.
game_combat.workspace = true
png.workspace = true
pollster.workspace = true
ron.workspace = true
# The preview's pose: what the sandbox samples, read from the same cooked clips.
sapphire_anim.workspace = true
sapphire_assets.workspace = true
sapphire_core.workspace = true
# Where each value of a document sits in its text.
sapphire_document.workspace = true
# The preview is a real run of the simulation.
sapphire_gameplay.workspace = true
# Save and push.
sapphire_livelink.workspace = true
sapphire_math.workspace = true
sapphire_moves.workspace = true
sapphire_physics.workspace = true
# The window, and only the window.
sapphire_platform.workspace = true
sapphire_render.workspace = true
sapphire_rhi.workspace = true
sapphire_serialize.workspace = true
# The viewport: the real renderer, on the window's device.
sapphire_stage.workspace = true
sapphire_time.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
egui_kittest.workspace = true

[lints]
workspace = true
