[package]
name = "sapphire_playtest"
description = "A playtest's session on disk: what a playtest build keeps of each time someone plays, and its format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The session document's `TypePath`, whose derive finds the crate by this name.
bevy_reflect.workspace = true
# The heat readings the frames' rows hold.
sapphire_core.workspace = true
# Each run's file and checksums, as `tests/replays/` keeps them.
sapphire_gameplay.workspace = true
# Writes off the frame's path.
sapphire_jobs.workspace = true
sapphire_reflect.workspace = true
sapphire_serialize.workspace = true
# The tick's length, for a report's seconds.
sapphire_time.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
# A run journal's records' digests, as a replay file's.
xxhash-rust.workspace = true

[dev-dependencies]
# The game's scenarios, those whose kinds of enemy bind a script among them, for the reports' tests.
sapphire_script.workspace = true

# A session's keeps killed for real (M4 F3): the test that kills, and the player it kills.
[[test]]
name = "keep_kill"
harness = false

[lints]
workspace = true
