# Crate layering for `cargo xtask check-layers` (spec §4.1, ADR 0001).
#
# kind = "runtime":  may depend only on runtime crates in *lower* layers, plus the
#                    same-layer edges listed in [allow].
# kind = "app":      shipping binaries; may depend on runtime crates, and on dev-only
#                    crates through optional dependencies.
# kind = "dev_only": ships only in development builds (sapphire_debug, the live-link
#                    runtime half, M1); reachable only from apps, through an optional
#                    dependency. May depend on runtime and other dev-only crates.
# kind = "tool":     never shipped; may depend on anything. Nothing may depend on a tool.
#
# `features` lists every Cargo feature the crate may declare (rule R8). Runtime features
# select platform or backend only; dev tooling enters through apps and dev-only crates.
#
# Every workspace member, and every path dependency outside the workspace (vendored crates), must
# appear here, so each gets a deliberate placement. Git dependencies are third-party code, like
# registry crates: deny.toml's [sources] admits each one, and the lists below police their reach.

[crates]
# L0 foundation: pure Rust, no OS windowing.
# `mimalloc`: the global allocator apps opt into (alloc::EngineAllocator).
sapphire_core = { kind = "runtime", layer = 0, features = ["mimalloc"] }
sapphire_math = { kind = "runtime", layer = 0 }
# L1 platform and system.
sapphire_platform = { kind = "runtime", layer = 1 }
sapphire_jobs = { kind = "runtime", layer = 1 }
sapphire_time = { kind = "runtime", layer = 1 }
sapphire_crash = { kind = "runtime", layer = 1 }
# L2 services.
sapphire_assets = { kind = "runtime", layer = 2 }
sapphire_ecs = { kind = "runtime", layer = 2 }
# The frame's look as plain data (scene constants, post's input) and the CPU models of how the
# renderer draws it: beneath the renderer and time of day alike, so tools that light by them link
# neither (M1 A8's follow-up). Depends on L0 alone.
sapphire_look = { kind = "runtime", layer = 2 }
# Moves' cooked plain data, which the cooker writes and the simulation reads (M2 D1): no ECS, no
# renderer, so tools can link it.
sapphire_moves = { kind = "runtime", layer = 2 }
sapphire_reflect = { kind = "runtime", layer = 2 }
sapphire_rhi = { kind = "runtime", layer = 2 }
sapphire_serialize = { kind = "runtime", layer = 2 }
# Static collision as plain data: groups, the document and the cooked format, beneath the physics
# crate and the asset server, so the cooker can read and check them without linking parry (M2 D3).
sapphire_colliders = { kind = "runtime", layer = 2 }
# L3 subsystems.
# Animation: samples, blends and solves (M2). Its cooked formats sit below it, in sapphire_assets,
# which checks every kind's bytes; it has no edge to the renderer or the world.
sapphire_anim = { kind = "runtime", layer = 3 }
sapphire_input = { kind = "runtime", layer = 3 }
sapphire_render = { kind = "runtime", layer = 3 }
# Time of day's model (keys, timelines, looks), beside the renderer rather than above it: the
# world runs it, and tools such as the probe bake resolve its keys without the world or renderer.
sapphire_tod = { kind = "runtime", layer = 3 }
# The collision world (spec §5.14). Reaches no renderer, world, platform or GPU: gameplay depends
# on it, and replays run with none of those in the tree.
sapphire_physics = { kind = "runtime", layer = 3 }
# Audio backends, cue playback and clock-aware mixing (spec §5.15). Plain data in, no ECS or
# renderer. Its cooked formats are `sapphire_assets`', so the cooker links no mixer.
sapphire_audio = { kind = "runtime", layer = 3 }
# Effects' documents and CPU simulation, beside the renderer rather than above it: they meet only
# in the plain sprites and ribbon points `sapphire_look` holds (rule R4), so neither links the other.
sapphire_vfx = { kind = "runtime", layer = 3 }
# L4 framework.
sapphire_world = { kind = "runtime", layer = 4 }
sapphire_gameplay = { kind = "runtime", layer = 4 }
# Dev-only (spec §4.1 places sapphire_debug in L3; as dev-only it has no layer of its own).
sapphire_debug = { kind = "dev_only" }
# Desktop hot reload (M1 A8). `notify`: the file-watching backend, which apps turn on for
# desktop targets; `default` turns it on for the crate's own tests.
sapphire_hot_reload = { kind = "dev_only", features = ["default", "notify"] }
# Renderer-independent watcher shared by hot reload and the standalone live-link tool.
sapphire_watch = { kind = "dev_only", features = ["default", "notify"] }
# Live link (M1 A9): the device half apps link through `dev`, and the desktop tool, a binary of
# the same crate that `cargo xtask link` runs.
sapphire_livelink = { kind = "dev_only" }
# Apps.
# `tracy`: stream profiling zones to Tracy (spec §5.3).
# `dev`: development builds, linking the dev-only crates (the debug overlay, spec §5.20).
sapphire_sandbox = { kind = "app", features = ["tracy", "dev"] }
# Tools.
sapphire_pipeline = { kind = "tool" }
# The headless replay runner (M2 D2): what `cargo xtask replay` and CI's Replays job build.
sapphire_replay = { kind = "tool" }
sapphire_testkit = { kind = "tool" }
xtask = { kind = "tool" }

# Same-layer dependencies that are allowed, as [from, to] pairs.
[allow]
edges = [
    # Formats store reflection's stable names and schema versions.
    ["sapphire_serialize", "sapphire_reflect"],
    # Cooked asset formats (meshes) are rkyv archives in sapphire_serialize's cooked
    # envelope, named and versioned through sapphire_reflect.
    ["sapphire_assets", "sapphire_serialize"],
    ["sapphire_assets", "sapphire_reflect"],
    # Baked tables are cooked the same way.
    ["sapphire_moves", "sapphire_serialize"],
    ["sapphire_moves", "sapphire_reflect"],
    # Cooked collider sets are named and versioned the same way, and packs store them.
    ["sapphire_colliders", "sapphire_serialize"],
    ["sapphire_colliders", "sapphire_reflect"],
    ["sapphire_assets", "sapphire_colliders"],
]

# The simulation's crates: what a replay job links (m2-plan §3, "Crate edges"). None of `forbidden`
# may be in their dependency trees through normal dependencies, so a replay builds quickly and runs
# with no window and no GPU. Each also has a clippy.toml banning what breaks determinism: the same
# file in every one, holding every workspace ban too, since a crate's file replaces the workspace's.
#
# `wgpu-types` isn't listed: bevy_reflect's `std` feature names it as a weak optional dependency
# (`wgpu-types?/std`), and `cargo metadata`'s graph keeps those though nothing builds it. `cargo tree
# -p sapphire_gameplay -e normal --all-features --target all` shows it isn't there.
#
# `runners` are the tools that run those crates in a job of their own: the same tree rule, with no
# clippy.toml, since they read files and print, and no result goes through them.
[simulation]
crates = ["sapphire_colliders", "sapphire_gameplay", "sapphire_moves", "sapphire_physics"]
runners = ["sapphire_replay"]
forbidden = [
    "naga",
    "sapphire_anim",
    "sapphire_input",
    "sapphire_platform",
    "sapphire_render",
    "sapphire_rhi",
    "sapphire_world",
    "sdl3-src",
    "sdl3-sys",
    "wgpu",
    "wgpu-core",
    "wgpu-hal",
]

# The content tool, and what it must never link through normal dependencies. The renderer and the
# world compile in the shaders and documents edited during look-dev, which made the first cook after
# such an edit take a minute (M1 A8's follow-up). A collision library has no place in a cook either:
# a cooked collider set is plain data, and the world builds from it at load (M2 D3). Nor has a mixer:
# cooked sounds and cues are plain data in `sapphire_assets` (M2 E1).
[cooker]
crates = ["sapphire_pipeline"]
forbidden = ["cpal", "kira", "parry3d", "rapier3d", "sapphire_physics", "sapphire_render", "sapphire_world"]

# Third-party crates that must never reach a runtime, app or dev-only crate's dependency
# tree.
[tool_only_dependencies]
crates = ["gltf", "image", "ctt", "toml", "cargo_metadata", "rayon", "meshopt", "vrm-spec", "ufbx"]

# Third-party crates that only dev-only crates may bring in: a runtime or app crate reaching one
# other than through a dev-only crate would link it into builds without `dev`.
[dev_only_dependencies]
crates = ["egui", "egui-wgpu", "notify"]
