# cargo-deny policy (spec §7.1, §9 gate 1). Run with `cargo deny check`; CI runs it on
# every PR through EmbarkStudios/cargo-deny-action.

[graph]
# Evaluate every platform we ship on, so platform-specific dependencies are covered.
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-linux-android",
    "x86_64-linux-android",
]
# Features select platform or backend (rule R8), so check the union of all of them.
all-features = true

[advisories]
# Security advisories always fail. Unmaintained notices fail only for crates we depend
# on directly; for transitive ones, raise it with the direct dependency.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# A commercial, closed-source game: permissive licenses only, no GPL/LGPL/AGPL family.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# No MPL-2.0 crate is in the tree today, so MPL is not allowed globally. Vendored MPL crates
# (ozz-animation-rs, Appendix A) get a per-crate entry in `exceptions` below. MPL-2.0 §3.2
# then obliges us to offer the source of those files with every binary we ship, modified
# or not; keep MPL code in its own files.
confidence-threshold = 0.93
# The allow-list is policy, not an inventory of what is in the tree today.
unused-allowed-license = "allow"
exceptions = [
    # egui's embedded fonts (Hack, Ubuntu, Noto Emoji), used only by the dev-only debug overlay
    # (sapphire_debug), which never ships. Both font licenses allow bundling the fonts in any
    # software, commercial included; they only restrict selling or renaming the fonts themselves.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
# Workspace crates are MIT (LICENSE, `license.workspace = true`) and `publish = false`; the
# allow-list above governs dependencies, so skip them here.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
# Workspace path dependencies carry no version; wildcards from registries are denied.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Spec Appendix A, "keep out of the dependency tree": archived, abandoned or dead ends.
deny = [
    { crate = "kajiya", reason = "archived renderer" },
    { crate = "rend3", reason = "archived renderer" },
    { crate = "naga_oil", reason = "archived; use wesl for shader composition" },
    { crate = "generational-arena", reason = "archived; use slotmap" },
    { crate = "oxidized_navigation", reason = "deprecated; use rerecast and landmass" },
    { crate = "laminar", reason = "dead networking crate" },
    { crate = "rrise", reason = "Wwise binding unmaintained since 2022; audio is FMOD (kira fallback)" },
    { crate = "oddio", reason = "dead end for audio; use FMOD or kira" },
    { crate = "bincode", reason = "3.0.0 is a compile_error! tombstone; use rkyv or postcard" },
    { crate = "optick", reason = "abandoned profiler; use tracy-client through profiling" },
    { crate = "rustybuzz", reason = "archived; text shaping goes through parley" },
    { crate = "bevy_cobweb_ui", reason = "dead end for UI; en_ui is taffy + parley" },
    { crate = "distill", reason = "abandoned asset pipeline" },
    { crate = "physx-rs", reason = "archived; physics is rapier with Jolt as the escape hatch" },
    { crate = "specs", reason = "dead ECS; use bevy_ecs" },
    { crate = "legion", reason = "dead ECS; use bevy_ecs" },
    # TLS, for when networking arrives (crash upload, patching): rustls with the ring provider and
    # bundled roots only, so mobile and Windows builds need no system TLS library and no extra C
    # toolchain.
    { crate = "openssl-sys", reason = "system OpenSSL: absent on iOS and Android, a C build everywhere; use rustls" },
    { crate = "native-tls", reason = "platform TLS stacks differ per OS; use rustls" },
    { crate = "aws-lc-sys", reason = "needs CMake, NASM on Windows and a C toolchain per target; rustls uses ring" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# ctt from its upstream commit until a release moves it to zstd 0.14 (see the patch in the root
# Cargo.toml); remove it with that patch.
allow-git = ["https://github.com/cwfitzgerald/ctt"]
