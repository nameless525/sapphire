[package]
name = "sapphire_watch"
description = "Renderer-independent file watching and repository source paths for Sapphire development tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sapphire_time.workspace = true
thiserror.workspace = true
tracing.workspace = true
notify = { workspace = true, optional = true }

[features]
# The crate's own tests exercise the desktop backend. Apps select it only on desktops.
default = ["notify"]
notify = ["dep:notify"]

[lints]
workspace = true
