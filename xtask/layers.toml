# Crate layering for `cargo xtask check-layers` (spec §4.1, ADR 0001).
#
# kind = "runtime":  may depend only on runtime crates in *lower* layers, plus the
#                    same-layer edges listed in [allow].
# kind = "app":      shipping binaries; may depend on runtime crates, and on dev-only
#                    crates through optional dependencies.
# kind = "dev_only": ships only in development builds (sapphire_debug, the live-link
#                    runtime half, M1); reachable only from apps, through an optional
#                    dependency. May depend on runtime and other dev-only crates.
# kind = "tool":     never shipped; may depend on anything. Nothing may depend on a tool.
#
# `features` lists every Cargo feature the crate may declare (rule R8). Runtime features
# select platform or backend only; dev tooling enters through apps and dev-only crates.
#
# Every workspace member, and every path dependency outside the workspace (vendored crates such
# as ozz-animation-rs), must appear here, so each gets a deliberate placement. Git dependencies
# are third-party code, like registry crates: deny.toml's [sources] admits each one, and the
# lists below police their reach.

[crates]
# L0 foundation: pure Rust, no OS windowing.
# `mimalloc`: the global allocator apps opt into (alloc::EngineAllocator).
sapphire_core = { kind = "runtime", layer = 0, features = ["mimalloc"] }
sapphire_math = { kind = "runtime", layer = 0 }
# L1 platform and system.
sapphire_platform = { kind = "runtime", layer = 1 }
sapphire_jobs = { kind = "runtime", layer = 1 }
sapphire_time = { kind = "runtime", layer = 1 }
sapphire_crash = { kind = "runtime", layer = 1 }
# L2 services.
sapphire_assets = { kind = "runtime", layer = 2 }
sapphire_ecs = { kind = "runtime", layer = 2 }
# The frame's look as plain data (scene constants, post's input) and the CPU models of how the
# renderer draws it: beneath the renderer and time of day alike, so tools that light by them link
# neither (M1 A8's follow-up). Depends on L0 alone.
sapphire_look = { kind = "runtime", layer = 2 }
sapphire_reflect = { kind = "runtime", layer = 2 }
sapphire_rhi = { kind = "runtime", layer = 2 }
sapphire_serialize = { kind = "runtime", layer = 2 }
# L3 subsystems.
sapphire_input = { kind = "runtime", layer = 3 }
sapphire_render = { kind = "runtime", layer = 3 }
# Time of day's model (keys, timelines, looks), beside the renderer rather than above it: the
# world runs it, and tools such as the probe bake resolve its keys without the world or renderer.
sapphire_tod = { kind = "runtime", layer = 3 }
# L4 framework.
sapphire_world = { kind = "runtime", layer = 4 }
# Dev-only (spec §4.1 places sapphire_debug in L3; as dev-only it has no layer of its own).
sapphire_debug = { kind = "dev_only" }
# Desktop hot reload (M1 A8). `notify`: the file-watching backend, which apps turn on for
# desktop targets; `default` turns it on for the crate's own tests.
sapphire_hot_reload = { kind = "dev_only", features = ["default", "notify"] }
# Renderer-independent watcher shared by hot reload and the standalone live-link tool.
sapphire_watch = { kind = "dev_only", features = ["default", "notify"] }
# Live link (M1 A9): the device half apps link through `dev`, and the desktop tool, a binary of
# the same crate that `cargo xtask link` runs.
sapphire_livelink = { kind = "dev_only" }
# Apps.
# `tracy`: stream profiling zones to Tracy (spec §5.3).
# `dev`: development builds, linking the dev-only crates (the debug overlay, spec §5.20).
sapphire_sandbox = { kind = "app", features = ["tracy", "dev"] }
# Tools.
sapphire_pipeline = { kind = "tool" }
sapphire_testkit = { kind = "tool" }
xtask = { kind = "tool" }

# Same-layer dependencies that are allowed, as [from, to] pairs.
[allow]
edges = [
    # Formats store reflection's stable names and schema versions.
    ["sapphire_serialize", "sapphire_reflect"],
    # Cooked asset formats (meshes) are rkyv archives in sapphire_serialize's cooked
    # envelope, named and versioned through sapphire_reflect.
    ["sapphire_assets", "sapphire_serialize"],
    ["sapphire_assets", "sapphire_reflect"],
]

# Third-party crates that must never reach a runtime, app or dev-only crate's dependency
# tree.
[tool_only_dependencies]
crates = ["gltf", "image", "ctt", "toml", "cargo_metadata", "rayon", "meshopt", "vrm-spec", "ufbx"]

# Third-party crates that only dev-only crates may bring in: a runtime or app crate reaching one
# other than through a dev-only crate would link it into builds without `dev`.
[dev_only_dependencies]
crates = ["egui", "egui-wgpu", "notify"]
