    # glam's SIMD types round differently per architecture (M4 C6): NEON sums a dot product's terms in another
    # order than SSE2, multiplies by a length's reciprocal where SSE2 divides, and fuses the multiply and subtract
    # in `Vec3A::cross` (so in `Quat * Vec3`) and the multiply-adds in `Quat * Quat`. A mesh cooked with them
    # differs between x86-64 and AArch64. Operators such as `quat * vec` can't be banned by path, nor `f32::min`
    # and `max` where a zero's sign could count (NEON takes −0 from 0 and −0, SSE2 its second operand): CI's
