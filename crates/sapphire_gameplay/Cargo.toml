[package]
name = "sapphire_gameplay"
description = "The headless simulation: a combat world that ticks with no window or GPU, with stable actor IDs, seeded randomness and a state checksum."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Bevy's derive macros find the crate by this name (see sapphire_ecs).
bevy_ecs.workspace = true
# Documents derive `TypePath`, whose derive finds the crate by this name: the arena's spawn points.
bevy_reflect.workspace = true
profiling.workspace = true
# The allocation counter in the simulation's stats (rule R6).
sapphire_core.workspace = true
# Validated cooked CPU assets for an optional deterministic body profile.
sapphire_assets.workspace = true
sapphire_body_pose.workspace = true
sapphire_ecs.workspace = true
sapphire_math.workspace = true
sapphire_moves.workspace = true
# Paths over a zone's navmesh, and that navmesh as cooked.
sapphire_nav.workspace = true
sapphire_navmesh.workspace = true
# The arena's collider document, which its scenario cooks.
sapphire_colliders.workspace = true
# The collision world characters move in, and that hit queries sweep through.
sapphire_physics.workspace = true
sapphire_reflect.workspace = true
sapphire_serialize.workspace = true
sapphire_time.workspace = true
# What a timeline does to the simulation: its time scale and gameplay events.
sapphire_timeline.workspace = true
# A zone's triggers and encounters, read when it's given one (M3 B2); what it is to the simulation when
# it's entered from a shelf (M3 W4): its colliders, its navmesh and its spawners; and the spawners the
# Lantern Ward's court scenario reads from its document.
sapphire_zone.workspace = true
# Controller profiles as document data.
serde.workspace = true
thiserror.workspace = true
# The state checksum.
xxhash-rust.workspace = true

[dev-dependencies]
# A profile read from a document.
ron.workspace = true

[lints]
workspace = true
