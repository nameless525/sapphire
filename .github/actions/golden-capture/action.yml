name: Capture and compare golden scenes
description: Run the existing golden gate, retaining its diagnostics and captures.
inputs:
  family:
    description: Backend family represented by the inputs.
    required: true
  shard:
    description: One-based shard number.
    required: true
  shards:
    description: Total shards for this family.
    required: true
  artifact:
    description: Exact-run golden input artifact; empty builds inline for the Metal singleton.
    default: ''
runs:
  using: composite
  steps:
    - name: Download golden inputs
      if: inputs.artifact != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/golden-download
    - name: Verify and unpack golden inputs
      if: inputs.artifact != ''
      shell: bash
      env:
        GOLDEN_FAMILY: ${{ inputs.family }}
      run: |
        ci_python=python3
        if [ "$RUNNER_OS" = Windows ]; then ci_python=python; fi
        "$ci_python" "$GITHUB_ACTION_PATH/../../scripts/golden_bundle.py" unpack \
          --archive "$RUNNER_TEMP/golden-download/golden-bundle.tar.gz" --destination target/golden-input \
          --commit "$GITHUB_SHA" --family "$GOLDEN_FAMILY"
    - name: Compare golden scenes
      shell: bash
      env:
        GOLDEN_PREBUILT: ${{ inputs.artifact != '' }}
        GOLDEN_SHARD: ${{ inputs.shard }}/${{ inputs.shards }}
      run: |
        if [ "$GOLDEN_PREBUILT" = true ]; then
          suffix=
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          "target/golden-input/bin/sapphire_testkit$suffix" golden \
            --sandbox "target/golden-input/bin/sapphire_sandbox$suffix" \
            --content target/golden-input/content --goldens tests/golden --out target/golden \
            --shard "$GOLDEN_SHARD"
        else
          cargo --locked xtask --locked golden --shard "$GOLDEN_SHARD"
        fi
