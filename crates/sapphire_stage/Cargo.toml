[package]
name = "sapphire_stage"
description = "A stage: a GPU, cooked content and a scene, stepped and drawn into a texture or a window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sapphire_anim.workspace = true
sapphire_assets.workspace = true
sapphire_audio.workspace = true
sapphire_camera.workspace = true
sapphire_core.workspace = true
sapphire_ecs.workspace = true
# bevy's `Component` / `Resource` derives resolve the `bevy_ecs` crate by name (see sapphire_ecs).
bevy_ecs.workspace = true
sapphire_gameplay.workspace = true
# The warm-up pool, where a boot fits the character's clearance off the frame (M4 H4).
sapphire_jobs.workspace = true
sapphire_loc.workspace = true
sapphire_math.workspace = true
sapphire_moves.workspace = true
sapphire_physics.workspace = true
sapphire_platform.workspace = true
sapphire_render.workspace = true
sapphire_rhi.workspace = true
sapphire_zone.workspace = true
sapphire_time.workspace = true
# Cooked timelines, which a content loads as it does any other kind and a show plays.
sapphire_timeline.workspace = true
# Cooked dialogues, loaded the same way, which a game walks (M3 Q2b).
sapphire_dialogue.workspace = true
sapphire_vfx.workspace = true
sapphire_world.workspace = true
profiling.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The packs live link pushes, dev-only (rule R8): linked only by the `dev` feature, which an app's own `dev`
# turns on.
sapphire_livelink = { workspace = true, optional = true }

[dev-dependencies]
# The tests hold allocations to their budgets, so they count them as an app does.
sapphire_core = { workspace = true, features = ["mimalloc"] }
# A zone with no art, for streaming's tests.
sapphire_synthetic_zone.workspace = true
# The player's languages through a real settings file, to show the voice's survives a save apart from
# the text's. The test's settings type derives `TypePath`, which finds `bevy_reflect` by name.
bevy_reflect.workspace = true
sapphire_reflect.workspace = true
sapphire_save.workspace = true
serde.workspace = true

[features]
# Development builds: the hooks hot reload and live link reach a stage by. An app's `dev` forwards it.
dev = ["dep:sapphire_livelink"]
# The sample scenes the sandbox's flags build, which a game never names: the swatches, the material,
# garment and face rigs, the courtyard, its plants and arcade, the outline scenes, demo lights and debug
# draw's demo. Off unless an app asks for them.
samples = []

# A caller outside the crate, on the platform's real loop, which must own the process's main thread.
[[test]]
name = "outside_caller"
harness = false

[lints]
workspace = true
