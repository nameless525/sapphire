[package]
name = "sapphire_core"
description = "Foundation types: logging, profiling, names, GUIDs, allocation tracking."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The engine's global allocator for apps: `alloc::EngineAllocator` (mimalloc, counted).
mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
tracing-log.workspace = true
# `tracing-log` lets the stderr formatter show the real target of bridged `log` records.
tracing-subscriber = { workspace = true, features = ["tracing-log"] }
xxhash-rust = { workspace = true, features = ["const_xxh3"] }

# Android loads apps with dlopen, which rejects mimalloc's default initial-exec TLS model.
# Kept here, with the allocator, so no app manifest has to repeat it (TLS model: ADR 0001).
[target.'cfg(target_os = "android")'.dependencies]
mimalloc = { workspace = true, optional = true, features = ["local_dynamic_tls"] }

[lints]
workspace = true
