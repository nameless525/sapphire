[package]
name = "game_app"
description = "The game: its flow from the title through its runs, on a stage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The game's identity on every platform is in platform/identity.toml, which the build script compiles in
# (`game_app::build_info`), with the build number `cargo xtask package` counts; its version is the package's.

# The library holds the app. Desktop and iOS link it into the `game_app` binary; Android builds it as a
# cdylib (`cargo rustc --crate-type cdylib`, driven by xtask) whose exported `SDL_main` SDLActivity calls.
[lib]
path = "src/lib.rs"

[[bin]]
name = "game_app"
path = "src/main.rs"

[dependencies]
game_combat.workspace = true
# The flow over the game's runs, and the show that stands on its stage (M3 G1).
game_flow.workspace = true
game_ui.workspace = true
sapphire_core = { workspace = true, features = ["mimalloc"] }
sapphire_crash.workspace = true
sapphire_jobs.workspace = true
# The test key a dev build trusts to sign a patch (M4 P4).
sapphire_patch.workspace = true
sapphire_platform.workspace = true
sapphire_render.workspace = true
sapphire_rhi.workspace = true
sapphire_save.workspace = true
sapphire_stage.workspace = true
sapphire_time.workspace = true
# A playtest build's session (M4 F1), through `playtest` alone.
sapphire_playtest = { workspace = true, optional = true }
png.workspace = true
profiling.workspace = true
tracing.workspace = true

# The build script reads platform/identity.toml and platform/patch.toml, and compiles Windows' resources.
[build-dependencies]
embed-resource.workspace = true
toml.workspace = true

[dev-dependencies]
# The conversation's IDs, for `opens_the_guide`, and a save's place for `plays_the_ward`.
sapphire_gameplay.workspace = true
# A debug line's ends, for `zero_hitches` to draw one nothing declares.
sapphire_math.workspace = true
# The ward's documents' IDs, for `plays_the_ward`.
sapphire_serialize.workspace = true
# WCAG 2.3.1's flash analyser, for `flashes_in_the_ward`.
sapphire_testkit.workspace = true

[features]
# What the crates under it have for development builds. The game adds no tools of its own.
dev = ["sapphire_stage/dev", "game_combat/dev", "game_ui/dev"]
# A playtest build (M4 F1): the shipping game, keeping each session under the player's files and putting a mark
# on the pause. `cargo xtask playtest` builds with it, and a store build never does.
playtest = ["dep:sapphire_playtest"]

# A caller outside the crate, on the platform's real loop, which must own the process's main thread.
[[test]]
name = "reaches_the_fight"
harness = false

[[test]]
name = "zone_trip"
harness = false

# Heat forced on the thermal ladder, and the tier it asks for changed under a trip's wipe (M4 T3).
[[test]]
name = "follows_the_ladder"
harness = false

# A conversation in the show, opened from the pack's dialogue and walked by the keyboard (M3 Q2b).
[[test]]
name = "opens_the_guide"
harness = false

[[test]]
name = "plays_the_ward"
harness = false

[[test]]
name = "wins_the_ward"
harness = false

# Exit test 6's flashes in the game that ships: the ward's whole walk judged by WCAG 2.3.1, every frame (M4 A7).
[[test]]
name = "flashes_in_the_ward"
harness = false

# A trip to the background and a lost device, in the game at the ward's court (M4 S6).
[[test]]
name = "comes_back"
harness = false

# Every tier at each rung of its ladder held in place, and every setting a player can step there, draw through
# no pipeline the load didn't declare (M4 H3).
[[test]]
name = "declares_every_setting"
harness = false

# Exit test 1's playthrough: the boot, the whole walk, every setting, a tier change, the thermal ladder and back to
# the title, with no pipeline built or waited for on a frame, and every load screen's frames timed (M4 H4).
[[test]]
name = "zero_hitches"
harness = false

# A playtest's mark, drawn: a run's file played to the tick it names (M4 F2).
[[test]]
name = "draws_a_marked_tick"
harness = false

[lints]
workspace = true
