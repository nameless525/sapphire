[package]
name = "sapphire_assets"
description = "Runtime asset identity, formats and loading: asset IDs, the cooked mesh, texture, material and pack formats, handles, the load pipeline and residency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Cooked meshes derive `TypePath`, whose derive finds the crate by this name.
bevy_reflect.workspace = true
blake3.workspace = true
bytemuck.workspace = true
# The release manifest's signature, which a build checks and never makes (M4 P1).
ed25519-dalek.workspace = true
half.workspace = true
ktx2.workspace = true
# Ogg Vorbis, for cooked sounds (M2 E1): the cooker's check and the runtime's decode alike.
lewton.workspace = true
lz4_flex.workspace = true
profiling.workspace = true
rend.workspace = true
rkyv.workspace = true
# Cooked collider sets, a kind of asset that CPU code reads (M2 D3).
sapphire_colliders.workspace = true
sapphire_bytecode.workspace = true
sapphire_dialogue.workspace = true
sapphire_navmesh.workspace = true
sapphire_timeline.workspace = true
sapphire_zone.workspace = true
# The form factor the default budgets are chosen by.
sapphire_core.workspace = true
# Decode jobs run on the engine's task pool.
sapphire_jobs.workspace = true
# Material blocks are cooked: their angles go through its pinned trigonometry (spec §5.27).
sapphire_math.workspace = true
# Move sets are cooked assets, checked as the simulation reads them.
sapphire_moves.workspace = true
sapphire_reflect.workspace = true
sapphire_serialize.workspace = true
# String tables are cooked assets, checked as the localizer reads them.
sapphire_strings.workspace = true
serde.workspace = true
# Generational slots behind handles (spec §5.3).
slotmap.workspace = true
thiserror.workspace = true
tracing.workspace = true
zstd.workspace = true

[dev-dependencies]
# Tests sign manifests with keys from fixed seeds.
ed25519-dalek = { workspace = true, features = ["zeroize"] }
postcard.workspace = true
ron.workspace = true
# Deadlines in the tests that wait on a worker.
sapphire_time.workspace = true

[lints]
workspace = true
