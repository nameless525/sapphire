[alias]
xtask = "run --quiet --package xtask --"
# The inner test loop: unit and integration tests without doctests, which cargo recompiles on
# every run (they were 2.3 s of the 2.7 s `cargo test --workspace`). CI runs everything.
test-fast = "test --workspace --lib --bins --tests"

# Minimum OS versions (spec §2), for rustc and for the C/C++ dependencies cc-rs and CMake
# build (SDL). They must match LSMinimumSystemVersion / MinimumOSVersion in
# platform/{macos,ios}/Info.plist, which `cargo xtask bundle` verifies. Forced so every
# cargo invocation agrees: sdl3-sys doesn't rerun when these change, so a mismatch would
# leave a stale SDL build (`cargo clean -p sdl3-sys` recovers).
[env]
MACOSX_DEPLOYMENT_TARGET = { value = "14.0", force = true }
IPHONEOS_DEPLOYMENT_TARGET = { value = "17.0", force = true }

# Profiling builds (the sandbox's `tracy` feature): keep Tracy's own crash handler out, so it
# can't take crashes ahead of sapphire_crash (on Windows, its vectored exception handler would
# terminate the process before a minidump is written). `profiling` turns on all of
# tracy-client's default features, `crash-handler` included, and Cargo can't switch a
# dependency's feature off, so the define goes in through the flags tracy-client-sys reads.
TRACY_CLIENT_SYS_CXXFLAGS = "-DTRACY_NO_CRASH_HANDLER"

# Google Play requires 16 KB page-aligned native libraries (spec §6.7). NDK r28+ already
# links that way by default (open question Q2, verified with r29); the flag keeps the
# guarantee explicit.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
