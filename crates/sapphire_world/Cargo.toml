[package]
name = "sapphire_world"
description = "The world framework: activating a zone's cells by distance within a budget, time of day (one set of keys that drives the sky, light, fog, ambient, shadow tint, post and the character rig, with zone overrides and cutscene tracks), the character light rig's presets, and the stack of combat's screen effects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# bevy's `Resource` derive finds the crate by this name (see sapphire_ecs).
bevy_ecs.workspace = true
# The `Reflect` derives on time-of-day keys find the crate by this name (see sapphire_reflect).
bevy_reflect.workspace = true
profiling.workspace = true
# What a zone's cells load through.
sapphire_assets.workspace = true
sapphire_ecs.workspace = true
sapphire_math.workspace = true
sapphire_reflect.workspace = true
# Time of day resolves into the frame packet's plain scene constants (rule R4: the renderer
# never depends on this crate).
sapphire_render.workspace = true
sapphire_serialize.workspace = true
sapphire_time.workspace = true
# Time of day's model, which `tod` re-exports and runs.
sapphire_tod.workspace = true
# The cooked zone the streamer reads.
sapphire_zone.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Waits on error scopes in the light rig's GPU tests.
pollster.workspace = true
# The counting allocator, for the allocation tests.
sapphire_core.workspace = true
# The light rig's GPU tests draw through the renderer on a device of their own.
sapphire_rhi.workspace = true
# A zone with no art, for streaming's tests.
sapphire_synthetic_zone.workspace = true

[lints]
workspace = true
