[package]
name = "sapphire_render"
description = "Sapphire's renderer: anime character shading under per-character light rigs with stylized GI, clustered or per-object local lights, inverted-hull outlines, sky gradient, HDR bloom and grading."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The `Reflect` derives on the quality-tier document find the crate by this name (see
# sapphire_reflect).
bevy_reflect.workspace = true
bytemuck.workspace = true
glam.workspace = true
profiling.workspace = true
sapphire_assets.workspace = true
# The device class (`target::FormFactor`) quality tiers are selected by, and the `r.*` cvars.
sapphire_core.workspace = true
sapphire_jobs.workspace = true
# The quality-tier table is a versioned RON document (`tiers.ron`).
sapphire_reflect.workspace = true
sapphire_rhi.workspace = true
sapphire_serialize.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# The anime character GPU tests write half-float control maps.
half.workspace = true
# The headless example writes a PNG. Dev-only, so it never reaches the runtime tree.
png.workspace = true
# Waits on error scopes in the GPU tests.
pollster.workspace = true
# Cooks the textures the GPU tests upload. Tools may be dev-dependencies (xtask check-layers).
sapphire_pipeline.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
