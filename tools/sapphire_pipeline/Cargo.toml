[package]
name = "sapphire_pipeline"
description = "Asset pipeline: sidecars, importers, bakers, cookers and the content cache. Never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "sapphire_pipeline"
path = "src/main.rs"

[dependencies]
sapphire_assets.workspace = true
# Color math shared with the runtime (sRGB, OkLab).
sapphire_math.workspace = true
sapphire_reflect.workspace = true
# The probe bake lights the sky as the renderer relights it (`ambient::sky_radiance`), under time
# of day's keys (M1 W5).
sapphire_render.workspace = true
sapphire_serialize.workspace = true
sapphire_world.workspace = true
anyhow.workspace = true
# `.meta` sidecars derive `TypePath`, whose derive finds the crate by this name.
bevy_reflect.workspace = true
blake3.workspace = true
bytemuck.workspace = true
ctt.workspace = true
getrandom.workspace = true
glam.workspace = true
# Probe grids store half floats (M1 W5).
half.workspace = true
# `extras` exposes per-object custom properties, which is how Blender drives character shading parameters.
# `extensions` exposes extensions gltf doesn't model, which is how VRM files carry theirs (M1 A6).
# `utils` reads accessors; buffers load in `import::gltf` rather than through `import` (which
# vrm-spec's dependency on gltf's defaults builds anyway, see the workspace manifest).
gltf = { workspace = true, features = ["extras", "extensions", "utils", "names"] }
image.workspace = true
meshopt.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
vrm-spec.workspace = true

[lints]
workspace = true
