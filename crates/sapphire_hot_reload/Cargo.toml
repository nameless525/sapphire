[package]
name = "sapphire_hot_reload"
description = "Desktop hot reload for development builds: watches the content root's packs, the renderer's WGSL sources and compiled-in documents, debounced, and reports what changed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Pack file names.
sapphire_assets.workspace = true
# The shader files the renderer is built from, and the sources it takes.
sapphire_render.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The file-watching backend (see `[features]`).
notify = { workspace = true, optional = true }

[features]
# On for this crate's own tests. Apps depend on it without default features and turn `notify`
# on for desktop targets alone (rule R8: the feature selects the backend), so phones never build
# the watcher.
default = ["notify"]
# File watching through `notify` (FSEvents, inotify, ReadDirectoryChangesW). Without it nothing
# is watched.
notify = ["dep:notify"]

[dev-dependencies]
# The compiled-in documents that `sources::default_day` and `sources::default_light_rigs` are
# checked against.
sapphire_world.workspace = true

[lints]
workspace = true
