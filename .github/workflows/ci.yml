# Per-PR checks (spec §8, quality gates in §9). Nightly cooks and device runs join as those
# systems land.
#
# The pinned version comes from rust-toolchain.toml. The local setup action installs
# only the job's targets and exports RUSTUP_TOOLCHAIN so Cargo keeps that subset. It
# removes unused toolchains on disposable hosted runners: rust-cache hashes all installed
# versions, and image rollouts otherwise split identical jobs into cold cache keys.
# Actions are pinned to commit SHAs, with the release in a comment;
# Dependabot (.github/dependabot.yml) keeps them current. Runner images are pinned too, so
# an image migration is a deliberate change here, not a surprise.
#
# Minimum OS versions come from .cargo/config.toml [env], which every cargo call reads.
#
# rust-cache (M4 I1): only runs on `main` write caches, and pull requests read them. A pull request's
# cache serves that pull request alone, and a run's dozen caches of 0.6 to 1 GB filled the repository's
# 10 GB, so they evicted each other and `main`'s. Nor does a failed or cancelled job save: `main`'s runs
# were cancelled a minute or two in, and each job saved a cache of little but the registry under the
# exact key, which later runs then took as up to date and never replaced. So every job of M3's last runs
# compiled its dependencies: Clippy took 6.7 minutes against 0.8 with a warm cache (2026-11-09), Metal's
# sandbox build 12.7 against 2.2, and App tests' builds 19 against 6.4. The nightly run keeps `main`'s
# caches warm when its push runs are cancelled, and a key's restore prefix finds the last one when
# Cargo.lock has moved since. The `v1-rust` prefix left those stubs behind.
#
# `cargo --locked xtask --locked …`: the first flag locks the build of xtask itself, the
# second makes xtask pass --locked to every cargo command it runs.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly on `main`, so the Rust caches every pull request reads exist (above).
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      capture_history_only:
        description: Warm only persistent capture history (off renders full warmup frames)
        type: choice
        options: ['on', 'off']
        default: 'on'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in CI builds: nothing debugs them, and it is a large share of compile and link
  # time (PDB generation on Windows above all) and of the cache. Panics still name functions.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TOOLS_DEBUG: "0"
  RUST_BACKTRACE: short
  SAPPHIRE_CAPTURE_HISTORY_ONLY: ${{ inputs.capture_history_only || 'on' }}
  # SDL 3 is built from source (sapphire_platform). Ubuntu build dependencies from SDL's
  # docs/README-linux.md: the "all features" list plus its Ubuntu 22.04+ additions.
  SDL3_LINUX_DEPS: >-
    build-essential pkg-config cmake ninja-build
    libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
    libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev
    libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev
    libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev
    liburing-dev
  # The C and C++ dependencies (SDL, mimalloc, Tracy) build differently per runner image
  # and macOS SDK, so both join rust-cache's key on top of its defaults. The `env` context
  # doesn't see runner variables such as ImageOS, so they go in by name rather than `key:`.
  RUST_CACHE_ENV_VARS: CARGO CC CFLAGS CXX CMAKE RUST ImageOS SDKROOT
  # Only `main` writes the Rust caches (above). Not named RUST*, which would put it in the caches' key.
  SAVE_RUST_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    # It hit 30 minutes once on a slow runner (#266, 2026-11-10), after 10 to 11 on the run before.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL3 build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SDL3_LINUX_DEPS
      - name: Install Rust (job targets)
        uses: ./.github/actions/setup-rust
        with:
          lint: 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Test CI setup and artifact verification
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Test who the motion tool writes
        run: python3 -B -m unittest discover -s tools/motion -p 'test_*.py' -v
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Optional features (`tracy`, `mimalloc`) only compile when enabled.
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Rustdoc with warnings denied: every intra-doc link resolves, private items' docs included
      # (the renderer documents its passes on internal modules), and public docs link to public
      # items only. The second build adds the sandbox's `dev` half, and documents only the sandbox
      # again; the first keeps links to dev-only items out of the docs every build has.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --locked --document-private-items
          cargo doc --workspace --no-deps --locked --document-private-items --features sapphire_sandbox/dev
      - name: Crate layering (R1, R8)
        run: cargo --locked xtask --locked check-layers
      - name: Licenses, bans, advisories, sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux binaries built on ubuntu-24.04 need its glibc (2.39). Spec §2's floor is
        # Ubuntu 22.04-era glibc, so `xtask package` (M4) must build Linux releases in an
        # older sysroot, such as the Steam Runtime SDK container.
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    # Windows from a cold cache (none from `main` to restore) ran out of 60 minutes: 49 to build and test,
    # 6 for audio, then the output-path check cut off 4 minutes in (#293, 2026-11-12). With a cache the
    # whole job takes about 32 (#292).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Linux's leg takes the whole history (about 370 MiB), so exit test 2's clause 3 reads the commit
          # that put a boss in its zone (`bosses_are_content.rs`), and fails there rather than skipping. The
          # 0 comes last: in an expression 0 is falsy, so `cond && 0 || 1` is always 1.
          fetch-depth: ${{ matrix.os != 'ubuntu-24.04' && 1 || 0 }}
      - name: Install SDL3 build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SDL3_LINUX_DEPS
      # SDL's CMake build for macOS needs the SDK named explicitly with some Xcode and
      # Command Line Tools combinations; cargo xtask does the same locally.
      - name: Select the macOS SDK
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Install Rust (job targets)
        uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          save-if: ${{ env.SAVE_RUST_CACHE }}
      # --no-fail-fast: one failing crate shouldn't hide the results of the rest.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      # Runners have no sound hardware, or whatever passes for it: the mixer must run on, not fail.
      - name: Audio with whatever device there is
        run: cargo test --package sapphire_audio --locked --test device -- --ignored --test-threads=1
      - name: Check native Windows output paths
        id: windows_output_paths
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          cargo build --locked --package sapphire_replay --package sapphire_testkit --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixtureTemp = Join-Path $env:RUNNER_TEMP 'sapphire-native-paths'
          New-Item -ItemType Directory -Path $fixtureTemp | Out-Null
          $env:TEMP = $env:TMP = $env:TMPDIR = $fixtureTemp
          python -B .github/scripts/windows_path_fixture/run.py --execute `
            --replay target/debug/sapphire_replay.exe `
            --testkit target/debug/sapphire_testkit.exe `
            --evidence (Join-Path $env:RUNNER_TEMP 'sapphire-windows-paths.json')
          exit $LASTEXITCODE
      - name: Retain Windows output-path evidence
        if: always() && runner.os == 'Windows' && steps.windows_output_paths.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-output-paths
          path: ${{ runner.temp }}/sapphire-windows-paths.json
          if-no-files-found: warn
          retention-days: 7

  # Spec §9's gates 2 and 4: every recorded combat replay reaches its checksums for the runner's
  # architecture, with no heap allocation in the fixed step. Linux and Windows compare against one
  # x86-64 file, which is what proves they agree, and macOS against the arm64 file.
  #
  # No SDL dependencies and no SDK: the runner links no C and no GPU (`[simulation]` in
  # xtask/layers.toml), and a build that needed them would mean that had stopped being true.
  #
  # target/replays/ always holds this architecture's file as it should be. When a change moves a
  # checksum, or a file is missing, that's the file to commit, from the artifact: x86-64 has no
  # machine here to run `--update` on (docs/development-iteration.md).
  replays:
    name: Replays (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (job targets)
        uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Replays
        run: cargo --locked xtask --locked replay
      - name: Upload this architecture's checksums
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-checksums-${{ matrix.os }}
          path: target/replays/
          if-no-files-found: ignore
          retention-days: 7

  # Golden scenes retain their existing counts and check names. Linux and Windows build/cook
  # once per OS, then fan out immutable exact-commit inputs; no Cargo target crosses runners.
  # Separate producer dependencies avoid making Linux wait for a Windows or Metal build.
  # Captures still run in separate sandbox processes, with all deadlines and diagnostics.
  # This graph targets repeated compiler/cooker work; measure its artifact barrier separately
  # from render time before claiming a critical-path speedup.
  golden-build-linux:
    name: Prepare golden inputs (vulkan-lavapipe)
    runs-on: ubuntu-24.04
    # 14 to 19 minutes in M3's last runs; it hit 30 once (#266, 2026-11-10).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL3 build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SDL3_LINUX_DEPS
      - name: Install Rust (job targets)
        uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          # Preserve the first pass's cache namespace after splitting the job graph.
          shared-key: golden
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Build capture executables
        run: cargo build --package sapphire_sandbox --package sapphire_testkit --locked
      - name: Cook the desktop content
        run: cargo --locked xtask --locked content
      - name: Package exact-commit golden inputs
        shell: bash
        env:
          GOLDEN_FAMILY: vulkan-lavapipe
        run: |
          ci_python=python3
          if [ "$RUNNER_OS" = Windows ]; then ci_python=python; fi
          "$ci_python" .github/scripts/golden_bundle.py create --archive "$RUNNER_TEMP/golden-bundle.tar.gz" \
            --commit "$GITHUB_SHA" --family "$GOLDEN_FAMILY"
      - name: Upload golden inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-inputs-vulkan-lavapipe
          path: ${{ runner.temp }}/golden-bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  golden-build-windows:
    name: Prepare golden inputs (dx12-warp)
    runs-on: windows-2025
    # 28 m 18 s and 29 m 58 s on M3's last two runs (2026-11-10): the Windows build is the slowest step.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (job targets)
        uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          # Preserve the first pass's cache namespace after splitting the job graph.
          shared-key: golden
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Build capture executables
        run: cargo build --package sapphire_sandbox --package sapphire_testkit --locked
      - name: Cook the desktop content
        run: cargo --locked xtask --locked content
      - name: Install WARP 1.0.21
        shell: pwsh
        run: |
          curl.exe -sSfL --retry 5 -o warp.zip https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.warp/1.0.21/microsoft.direct3d.warp.1.0.21.nupkg
          if ((Get-FileHash warp.zip -Algorithm SHA256).Hash -ne "EA44B77EB30EEC14427193E20F40CDB2E4C31ED11AB39CB880538FDF4BAC2681") { throw "WARP package checksum mismatch" }
          tar.exe -xf warp.zip build/native/bin/x64/d3d10warp.dll
          Copy-Item build/native/bin/x64/d3d10warp.dll target/debug/
      - name: Package exact-commit golden inputs
        shell: bash
        env:
          GOLDEN_FAMILY: dx12-warp
        run: |
          ci_python=python3
          if [ "$RUNNER_OS" = Windows ]; then ci_python=python; fi
          "$ci_python" .github/scripts/golden_bundle.py create --archive "$RUNNER_TEMP/golden-bundle.tar.gz" \
            --commit "$GITHUB_SHA" --family "$GOLDEN_FAMILY"
      - name: Upload golden inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-inputs-dx12-warp
          path: ${{ runner.temp }}/golden-bundle.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # The two desktop cooks above, from one commit on two OSes and C libraries and whatever CPUs the
  # runners have, must be the same bytes (M4 C3). A difference fails here, naming each asset that
  # moved, rather than as a golden that a pack from one runner changed.
  cooks-agree:
    name: Cooks agree (Linux, Windows)
    needs: [golden-build-linux, golden-build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: golden-inputs-vulkan-lavapipe
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: golden-inputs-dx12-warp
          path: ${{ runner.temp }}/windows
      - name: Compare the cooks
        run: |
          python3 .github/scripts/cooks_agree.py "$RUNNER_TEMP/linux/golden-bundle.tar.gz" \
            "$RUNNER_TEMP/windows/golden-bundle.tar.gz"

  # Linux's cook (x86-64) against the Metal job's (AArch64): every asset but the block-compressed
  # textures, which each architecture's own kernels encode, must be the same bytes (M4 C6). A mesh
  # that differs names a cook step whose arithmetic rounds by architecture: glam's SIMD types, or C++
  # built with contraction.
  cooks-agree-architectures:
    name: Cooks agree (Linux, macOS)
    needs: [golden-build-linux, golden-metal]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: golden-inputs-vulkan-lavapipe
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cooked-desktop-metal
          path: ${{ runner.temp }}/macos
      - name: Compare the cooks
        run: |
          python3 .github/scripts/cooks_agree.py "$RUNNER_TEMP/linux/golden-bundle.tar.gz" \
            "$RUNNER_TEMP/macos" --across-architectures

  golden-linux:
    name: Golden images (vulkan-lavapipe ${{ matrix.shard }}/3)
    needs: golden-build-linux
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    # Two shards took 43 and 28 minutes on M3's last run (2026-11-10): the cost table lacked 75 scenes,
    # Q4's `game-ward-gate-*` among them at 3 to 6 minutes each. With the table refreshed (M4 I1), three
    # shards' scenes come to 21 to 25 minutes on M3's last three runs' times.
    timeout-minutes: 45
    env:
      SAPPHIRE_GPU_BACKEND: vulkan
      SAPPHIRE_GPU_DEBUG: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No compiler/SDK/header install is needed to execute the verified binaries. The app links
      # ALSA's library, though no golden run opens a device.
      - name: Install the Vulkan runtime loader and ALSA's library
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 libasound2t64
      - name: Install lavapipe (Mesa 26.1.3)
        uses: ./.github/actions/lavapipe
      - name: Golden images
        uses: ./.github/actions/golden-capture
        with:
          family: vulkan-lavapipe
          shard: ${{ matrix.shard }}
          shards: '3'
          artifact: golden-inputs-vulkan-lavapipe
      - name: Gather crash diagnostics
        if: failure() || cancelled()
        timeout-minutes: 2
        shell: bash
        env:
          GOLDEN_PREBUILT: 'true'
        run: bash .github/scripts/golden_diagnostics.sh gather
      - name: Replay the first scene with serial passes
        if: failure()
        timeout-minutes: 5
        shell: bash
        env:
          GOLDEN_PREBUILT: 'true'
        run: bash .github/scripts/golden_diagnostics.sh replay
      - name: Upload captures and diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-vulkan-lavapipe-${{ matrix.shard }}of3
          path: target/golden/
          if-no-files-found: ignore
          retention-days: 7

  golden-windows:
    name: Golden images (dx12-warp ${{ matrix.shard }}/6)
    needs: golden-build-windows
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      SAPPHIRE_GPU_BACKEND: dx12
      SAPPHIRE_GPU_DEBUG: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Golden images
        uses: ./.github/actions/golden-capture
        with:
          family: dx12-warp
          shard: ${{ matrix.shard }}
          shards: '6'
          artifact: golden-inputs-dx12-warp
      - name: Gather crash diagnostics
        if: failure() || cancelled()
        timeout-minutes: 2
        shell: bash
        env:
          GOLDEN_PREBUILT: 'true'
        run: bash .github/scripts/golden_diagnostics.sh gather
      - name: Replay the first scene with serial passes
        if: failure()
        timeout-minutes: 5
        shell: bash
        env:
          GOLDEN_PREBUILT: 'true'
        run: bash .github/scripts/golden_diagnostics.sh replay
      - name: Upload captures and diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-dx12-warp-${{ matrix.shard }}of6
          path: target/golden/
          if-no-files-found: ignore
          retention-days: 7

  golden-metal:
    name: Golden images (metal 1/1)
    runs-on: macos-26
    # One shard needs no artifact fanout.
    timeout-minutes: 45
    env:
      SAPPHIRE_GPU_BACKEND: metal
      SAPPHIRE_GPU_DEBUG: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the macOS SDK
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Install Rust (job targets)
        uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          # Preserve the first pass's cache namespace after splitting the job graph.
          shared-key: golden
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Build the sandbox
        run: cargo build --package sapphire_sandbox --locked
      - name: Golden images
        uses: ./.github/actions/golden-capture
        with:
          family: metal
          shard: '1'
          shards: '1'
      - name: Gather crash diagnostics
        if: failure() || cancelled()
        timeout-minutes: 2
        shell: bash
        env:
          GOLDEN_PREBUILT: 'false'
        run: bash .github/scripts/golden_diagnostics.sh gather
      - name: Replay the first scene with serial passes
        if: failure()
        timeout-minutes: 5
        shell: bash
        env:
          GOLDEN_PREBUILT: 'false'
        run: bash .github/scripts/golden_diagnostics.sh replay
      - name: Upload captures and diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-metal-1of1
          path: target/golden/
          if-no-files-found: ignore
          retention-days: 7
      # AArch64's desktop cook, which the golden run made, for Cooks agree (Linux, macOS).
      - name: Upload the cook
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cooked-desktop-metal
          path: target/content/desktop/*.spack
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1

  # The GPU tests, `#[ignore]`d in the Test job because it has no GPU: the renderer's invariants
  # that the goldens' final frames don't show, such as the pipelines a shader edit rebuilds,
  # prepass masks, history resets and off-thread shader builds, the debug overlay's gestures
  # (review DV-10), and the dev sandbox's shader push across a hot reload (review BC-001). They were
  # written on Metal; here they run one at a time on the golden jobs' pinned CPU rasterizers, with
  # the same environment. A test that a CPU rasterizer can't run skips itself, naming the adapter
  # and why (spec §9 lists them); none is skipped for failing. `--tests` leaves the doctests to the
  # Test job.
  #
  # WARP runs the same suites in gpu-tests-warp.yml once a change is on main: 31 minutes of tests
  # after a cold 18-minute build, longer than a PR's other checks together.
  gpu-tests:
    name: GPU tests (${{ matrix.family }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, family: vulkan-lavapipe, backend: vulkan }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SAPPHIRE_GPU_BACKEND: ${{ matrix.backend }}
      SAPPHIRE_GPU_DEBUG: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL3 build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SDL3_LINUX_DEPS libvulkan1
      - name: Install lavapipe (Mesa 26.1.3)
        if: runner.os == 'Linux'
        uses: ./.github/actions/lavapipe
      - name: Install Rust (job targets)
        uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          save-if: ${{ env.SAVE_RUST_CACHE }}
      # Built apart from the run, so the run's time is the tests' own. Bash on every runner, so
      # the first build's failure fails the step (Windows' default PowerShell checks the last).
      - name: Build the GPU tests
        shell: bash
        run: |
          cargo test --package sapphire_render --package sapphire_rhi --package sapphire_world --package sapphire_debug --locked --tests --no-run
          cargo test --package sapphire_sandbox --package sapphire_stage --package game_combat --package game_ui --features dev --locked --lib --no-run
      - name: GPU tests (render, RHI, world, debug overlay)
        run: cargo test --package sapphire_render --package sapphire_rhi --package sapphire_world --package sapphire_debug --locked --tests --no-fail-fast -- --ignored --test-threads=1
      - name: GPU tests (stage and sandbox, dev)
        run: cargo test --package sapphire_sandbox --package sapphire_stage --package game_combat --package game_ui --features dev --locked --lib -- --ignored --test-threads=1

  # A development build, headless on lavapipe, in the real app: replays beside the renderer, live
  # tuning, the timeline editor against a real fight, and the app driven over live link (review
  # BC-002), as the M1 exit run's desktop leg does. No other job starts a `dev` app. These were the
  # GPU tests job's last steps, and took 21 of its 37 minutes, which made it the last job of every run
  # by 12 to 19 minutes.
  #
  # One job builds and cooks once and four lanes run the tests (M4 I1). As one job it took 107.5 minutes
  # on M3's last run (2026-11-10): 19 to build cold, 7 to cook, then the whole walk 36 (its two tiers
  # 16 and 20) and the sandbox's replays 31, a wave's bench 23 of them. The lanes are the walk's two
  # tiers, the bench, and the rest, each 12 to 23 minutes of tests on the runners of M3's last runs.
  # `app_tests_bundle.py` carries the build: every test executable, the dev sandbox, the live-link tool
  # and the cook, each put back where Cargo built it, so the paths the tests were compiled with hold.
  app-tests-build:
    name: Prepare app tests (vulkan-lavapipe)
    runs-on: ubuntu-24.04
    # 18 to 31 minutes with every dependency compiled (M3's last runs), about 11 with them cached.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDL3 build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SDL3_LINUX_DEPS
      - name: Install Rust (job targets)
        uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          save-if: ${{ env.SAVE_RUST_CACHE }}
      # The same package/feature selections the lanes run, each its own build: a union of these
      # packages can build a different feature graph from the separate runs. Cargo's messages name each
      # test's executable for the bundle. The last build adds the live-link tool to the dev sandbox's
      # graph, compiling only the tool: the sandbox the tests start is the same executable.
      - name: Build the app tests
        run: |
          messages="$RUNNER_TEMP/app-tests.jsonl"
          tests() { cargo test --locked --no-run --message-format=json-render-diagnostics "$@" >> "$messages"; }
          tests --package sapphire_stage --features dev --test outside_caller
          tests --package game_app --features dev --test reaches_the_fight
          tests --package game_app --features dev --test zone_trip
          tests --package game_app --features dev --test opens_the_guide
          tests --package game_app --features dev --test plays_the_ward
          tests --package game_app --features dev --test wins_the_ward
          tests --package game_app --features dev --test comes_back
          tests --package game_app --features dev --test declares_every_setting
          tests --package game_app --features dev --test follows_the_ladder
          tests --package game_app --features dev --test draws_a_marked_tick
          tests --package game_app --features dev --test zero_hitches
          tests --package sapphire_sandbox --features dev --test replays
          tests --package sapphire_sandbox --features dev --test live_tuning
          tests --package sapphire_sandbox --features dev --test flashes
          tests --package sapphire_editor --test preview --test sandbox_push --test viewport_stage
          cargo build --package sapphire_sandbox --package sapphire_livelink --features sapphire_sandbox/dev --locked
      - name: Cook the desktop content
        run: cargo --locked xtask --locked content
      - name: Package exact-commit app test inputs
        run: |
          python3 .github/scripts/app_tests_bundle.py create --archive "$RUNNER_TEMP/app-tests.tar.gz" \
            --commit "$GITHUB_SHA" --messages "$RUNNER_TEMP/app-tests.jsonl"
      - name: Upload app test inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-test-inputs
          path: ${{ runner.temp }}/app-tests.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  app-tests:
    name: App tests (vulkan-lavapipe, ${{ matrix.lane }})
    needs: app-tests-build
    strategy:
      fail-fast: false
      matrix:
        lane: [walk-desktop-low, walk-mobile-low, wave-bench, the-rest]
    runs-on: ubuntu-24.04
    # Each lane's tests took 12 to 23 minutes on M3's last runs, and a lane adds about 2 to set up. On M4's
    # line the Desktop-Low walk began 21 minutes in and needs about 17 more.
    timeout-minutes: 75
    env:
      SAPPHIRE_GPU_BACKEND: vulkan
      SAPPHIRE_GPU_DEBUG: none
      # The sandbox's slowest replay test, a lane of its own; `the-rest` skips it by the same name.
      WAVE_BENCH: a_wave_comes_on_in_a_bench_with_no_heap_in_its_steps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No compiler: the lanes run the producer's executables. The app links ALSA's library.
      - name: Install the Vulkan runtime loader and ALSA's library
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 libasound2t64
      - name: Install lavapipe (Mesa 26.1.3)
        uses: ./.github/actions/lavapipe
      - name: Download app test inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-test-inputs
          path: ${{ runner.temp }}/app-tests-download
      - name: Verify and unpack app test inputs
        run: |
          python3 .github/scripts/app_tests_bundle.py unpack \
            --archive "$RUNNER_TEMP/app-tests-download/app-tests.tar.gz" --commit "$GITHUB_SHA"
      # Exit test 1's playthrough (M4 H4) on Desktop-Low: the game booted as its window boots it, the title, the
      # whole walk through the flow to the boss's defeat, and at the gate's line a pause where the thermal ladder
      # goes down and back up, every setting is pressed round and the tier changes to Desktop-High and back; then
      # back to the title under the wipe. A pipeline built or waited for on any frame from the boot screen's first
      # fails it. It plays the whole walk `wins_the_ward` plays and holds all that holds (checksums, no step
      # allocating, every encounter cleared), so it takes that lane's Desktop-Low step. One frame in eight drawn,
      # the rest prepared and recorded, so their first uses count; load screens and the pause's pages drawn whole.
      - name: Exit test 1's playthrough (Desktop-Low)
        if: matrix.lane == 'walk-desktop-low'
        env:
          SAPPHIRE_HITCH_DRAW_EVERY: "8"
          SAPPHIRE_HITCH_SIZE: 160x90
          SAPPHIRE_HITCH_TIER: desktop-low
        run: python3 .github/scripts/app_tests_bundle.py run zero_hitches -- --ignored
      # The whole walk through the game's flow, from a new game to the boss's defeat, on Mobile-Low's settings: no
      # pipeline built after load, no step allocating, and the replay's checksums reached (M3 G1c, exit tests 1 and
      # 7). Its 14,320 steps are every step stepped but one frame drawn in eight here, as lavapipe can't draw them
      # all in the job's time; a Mac draws every one. Desktop-Low's walk is the playthrough's, above.
      - name: The whole walk in the game (Mobile-Low)
        if: matrix.lane == 'walk-mobile-low'
        env:
          SAPPHIRE_WALK_STEPS_PER_FRAME: "8"
          SAPPHIRE_WALK_TIERS: mobile-low
        run: python3 .github/scripts/app_tests_bundle.py run wins_the_ward -- --ignored
      # Every setting a player can step, at each rung of the tier's ladder held in place, from the pause over
      # the gate's line with the fight's screen effects held: no pipeline built past the load (M4 H3). The
      # walk's two tiers, a lane each; a Mac walks all four in about 20 s. Lavapipe walks each of a tier's five
      # ladder rungs in 3 to 3.5 minutes with T3's and A4's rows: 15 minutes ran out at the fifth.
      - name: Every setting declared (Desktop-Low)
        if: matrix.lane == 'walk-desktop-low'
        timeout-minutes: 40
        env:
          SAPPHIRE_REACH_TIERS: desktop-low
        run: python3 .github/scripts/app_tests_bundle.py run declares_every_setting -- --ignored
      - name: Every setting declared (Mobile-Low)
        if: matrix.lane == 'walk-mobile-low'
        timeout-minutes: 40
        env:
          SAPPHIRE_REACH_TIERS: mobile-low
        run: python3 .github/scripts/app_tests_bundle.py run declares_every_setting -- --ignored
      # A wave comes on in a bench of the arena with no heap in its steps, every frame drawn.
      - name: A wave's bench in the app (dev sandbox, offscreen)
        if: matrix.lane == 'wave-bench'
        run: python3 .github/scripts/app_tests_bundle.py run replays -- --ignored --test-threads=1 --exact "$WAVE_BENCH"
      # What a game or the editor does with a stage: make it, step it, and read a frame back, with
      # only its public surface (m3-plan S1).
      - name: A stage from outside its crate
        if: matrix.lane == 'the-rest'
        run: python3 .github/scripts/app_tests_bundle.py run outside_caller -- --ignored
      # The game from outside its crates: wait at the title, press, and see a fight go by.
      - name: The game from its title to a fight
        if: matrix.lane == 'the-rest'
        run: python3 .github/scripts/app_tests_bundle.py run reaches_the_fight -- --ignored
      # A zone trip under the game's wipe: every frame it covers is the same picture, and the zone changes
      # only under it (M3 W4).
      - name: A zone trip in the game
        if: matrix.lane == 'the-rest'
        run: python3 .github/scripts/app_tests_bundle.py run zone_trip -- --ignored
      # A conversation in the game: the pack's dialogue, opened, walked by the keyboard to the choice that
      # lights the ward, with no pipeline built and no step allocating (M3 Q2b).
      - name: A conversation in the game
        if: matrix.lane == 'the-rest'
        run: python3 .github/scripts/app_tests_bundle.py run opens_the_guide -- --ignored
      # The game's flow on its stage, the Lantern Ward: a continue from the court, its gate cutscene skipped,
      # the guide's choice, back to the title under the wipe and a continue that plays neither again (M3 G1).
      - name: The game's flow through the ward
        if: matrix.lane == 'the-rest'
        run: python3 .github/scripts/app_tests_bundle.py run plays_the_ward -- --ignored
      # A trip to the background at the ward's court: the run pauses, its save and file are on disk, nothing
      # steps till the pause's row goes on, and no checksum moves; then a lost device, and the game back at the
      # save, at the pause, drawing on a new one (M4 S6).
      - name: The game leaving the foreground and losing its device
        if: matrix.lane == 'the-rest'
        run: python3 .github/scripts/app_tests_bundle.py run comes_back -- --ignored
      # Heat forced on the tier's thermal ladder steps it down at once, and the tier it then asks for is built
      # off the frame and changed to only under a trip's wipe, with no frame building a pipeline (M4 T3, exit
      # test 4's ladder in the game). 3 s on an M5's Metal (2026-11-11), so a minute or two here: the lane's
      # other tests ran 18 to 24 times as long here as there.
      - name: The game following the thermal ladder
        if: matrix.lane == 'the-rest'
        run: python3 .github/scripts/app_tests_bundle.py run follows_the_ladder -- --ignored
      # A playtest's mark, drawn: the game's capture plays the walk's file to the tick it names, not one before
      # or after, and a tick past the file's end is an error (M4 F2, exit test 8). 10 s on the M5's Metal, so 3 to 7 minutes here.
      - name: A playtest's marked tick, drawn
        if: matrix.lane == 'the-rest'
        run: python3 .github/scripts/app_tests_bundle.py run draws_a_marked_tick -- --ignored
      # The simulation beside the renderer must reach what it reaches alone (m2-plan D2). The app
      # compares, tick by tick, with what a headless run in the test wrote. The wave's bench has its lane.
      - name: Replays in the app (dev sandbox, offscreen)
        if: matrix.lane == 'the-rest'
        run: python3 .github/scripts/app_tests_bundle.py run replays -- --ignored --test-threads=1 --skip "$WAVE_BENCH"
      # An edit of a move reaches a running fight's next attempt, over live link and through hot
      # reload, and a bad one changes nothing (m2-plan T2, exit test 2).
      - name: Live tuning (dev sandbox, offscreen)
        if: matrix.lane == 'the-rest'
        run: python3 .github/scripts/app_tests_bundle.py run live_tuning -- --ignored --test-threads=1
      # The timeline editor against what the desktop cook holds and against a real fight: its preview
      # matches the simulation's pose and volumes, and save and push reaches the fight's next attempt
      # (m2-plan T3). It finds the dev sandbox where the producer built it.
      - name: Timeline editor (real cook, dev sandbox offscreen)
        if: matrix.lane == 'the-rest'
        run: |
          python3 .github/scripts/app_tests_bundle.py run preview -- --ignored --test-threads=1
          python3 .github/scripts/app_tests_bundle.py run sandbox_push -- --ignored --test-threads=1
      # The real renderer in an editor's pane on Vulkan: a lost device leaves the documents and draws what
      # a capture does, at a scale other than 1, and a run from a snapshot reaches a headless fight's
      # checksum with no first-use pipeline and leaves the documents alone (m3-plan E3, E4). By name, because
      # a stage stands in 10 to 20 s here and a frame takes a second or two: these two are 4 stands and
      # about 90 frames, 2 to 5 minutes. The rest of the file is about 45 stands, and `what_the_viewport_costs`
      # is 600 frames at 1822 by 925 that only print, so they stay on a real GPU.
      - name: The viewport (real cook)
        if: matrix.lane == 'the-rest'
        timeout-minutes: 10
        run: >-
          python3 .github/scripts/app_tests_bundle.py run viewport_stage -- --ignored --test-threads=1 --exact
          a_lost_device_takes_the_stage_and_leaves_the_documents a_short_run_leaves_the_documents_alone
      # The dev sandbox offscreen on a private port, with a fight running: the tool reads its
      # status, sets a cvar, captures a frame and pushes a document that doesn't parse, which the
      # app must refuse and count while it goes on drawing, and an edit of the fight's moves, which
      # it must take. A pack pushed and then touched on disk must be told of, and `r.tier` must
      # make a new renderer. Then it must quit cleanly on SIGTERM, writing the fight's recording.
      # `--frames` bounds a run that the quit never reaches, and the step's limit everything else.
      - name: Live-link smoke (dev sandbox, offscreen)
        if: matrix.lane == 'the-rest'
        timeout-minutes: 10
        shell: bash
        run: |
          out=target/live-link-smoke
          mkdir -p "$out"
          addr=127.0.0.1:47811
          SAPPHIRE_CONTENT_DIR="$PWD/target/content/desktop" target/debug/sapphire_sandbox --offscreen \
            --size 640x360 --frames 36000 --live-link "$addr" --record "$out/session.sreplay" \
            --scenario duel --script attempts > "$out/sandbox.log" 2>&1 &
          app=$!
          trap 'kill -KILL "$app" 2>/dev/null || true' EXIT
          link() { timeout 120 target/debug/sapphire_livelink --addr "$addr" "$@"; }
          # It answers once it has built the scene's pipelines, slowly on a CPU rasterizer.
          for attempt in $(seq 240); do
            if link status > "$out/status.log" 2>&1; then break; fi
            if ! kill -0 "$app" 2>/dev/null || [ "$attempt" = 240 ]; then
              echo "::error::the dev sandbox never answered on $addr"
              tail -n 50 "$out/sandbox.log"
              exit 1
            fi
            sleep 1
          done
          cat "$out/status.log"
          link cvar r.outline_distance 0.5
          link capture "$out/capture.png"
          test -s "$out/capture.png"
          printf '(not a document' > "$out/malformed.ron"
          if link push "$out/malformed.ron" 2> "$out/push.log"; then
            echo "::error::the dev sandbox applied a malformed document"
            exit 1
          fi
          cat "$out/push.log"
          # Refused by the app, which names the file, rather than a lost connection.
          grep -q "malformed.ron: " "$out/push.log"
          link status 2> "$out/status-after.log"
          cat "$out/status-after.log"
          grep -q ", 1 refused," "$out/status-after.log"
          sed 's/startup: 5,/startup: 6,/' crates/sapphire_moves/test_content/slice.moves.ron > "$out/slice.moves.ron"
          link push "$out/slice.moves.ron"
          link status 2> "$out/status-tuned.log"
          cat "$out/status-tuned.log"
          grep -q "slice.moves.ron (moves): 1 edits" "$out/status-tuned.log"
          logged() {
            for attempt in $(seq 240); do
              if grep -q "$1" "$out/sandbox.log"; then return 0; fi
              sleep 1
            done
            echo "::error::the dev sandbox never logged: $1"
            tail -n 50 "$out/sandbox.log"
            return 1
          }
          link push target/content/desktop/shared.spack
          touch target/content/desktop/shared.spack
          logged "that version isn't in use"
          link cvar r.tier mobile-high
          logged "renderer rebuilt for the quality tier"
          link capture "$out/capture-mobile-high.png"
          test -s "$out/capture-mobile-high.png"
          kill -TERM "$app"
          code=0
          wait "$app" || code=$?
          tail -n 20 "$out/sandbox.log"
          if [ "$code" != 0 ]; then
            echo "::error::the dev sandbox exited with $code"
            exit 1
          fi
          test -s "$out/session.sreplay"
      - name: Upload the live-link smoke's logs
        if: always() && matrix.lane == 'the-rest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-link-smoke
          path: target/live-link-smoke/
          if-no-files-found: ignore
          retention-days: 7

  # Exit test 6's flashes (M4 A3, Z3c): every frame of the scripted fight, 1,700 of them at 480 × 270 on
  # Desktop-High with its cues, judged by WCAG 2.3.1's general and red flash tests, with flashes reduced and
  # at the default, a runner each. Both took 135 s on an M5's Metal (2026-11-11); the wave's bench, the
  # nearest lane that draws every frame, takes 43 times as long here as there, and this one draws 56 times
  # its pixels on a richer tier, so a setting should take an hour or more: no pull request's lane fits it.
  # So it runs on CI's nightly run and on a dispatch, from the same producer's build and cook; a change to
  # the screen effects or the cues proves it locally on Metal, or by a dispatch on its branch.
  app-tests-flashes:
    name: App tests (vulkan-lavapipe, flashes ${{ matrix.flashes }})
    needs: app-tests-build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - flashes: reduced
            test: the_scripted_fight_passes_wcag_2_3_1_with_flashes_reduced
          - flashes: default
            test: the_scripted_fight_passes_wcag_2_3_1_by_default
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SAPPHIRE_GPU_BACKEND: vulkan
      SAPPHIRE_GPU_DEBUG: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Vulkan runtime loader and ALSA's library
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 libasound2t64
      - name: Install lavapipe (Mesa 26.1.3)
        uses: ./.github/actions/lavapipe
      - name: Download app test inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-test-inputs
          path: ${{ runner.temp }}/app-tests-download
      - name: Verify and unpack app test inputs
        run: |
          python3 .github/scripts/app_tests_bundle.py unpack \
            --archive "$RUNNER_TEMP/app-tests-download/app-tests.tar.gz" --commit "$GITHUB_SHA"
      - name: The scripted fight's flashes (WCAG 2.3.1)
        run: python3 .github/scripts/app_tests_bundle.py run flashes -- --ignored --nocapture --exact "${{ matrix.test }}"

  mobile-build-ios:
    name: Mobile build (iOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (job targets)
        uses: ./.github/actions/setup-rust
        with:
          group: ios
      # No SDKROOT here: these builds target the iOS SDKs, which cargo and CMake pick.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          save-if: ${{ env.SAVE_RUST_CACHE }}
      # Release with LTO, the configuration that ships: thin LTO once dropped a symbol SDL needed
      # (`___isPlatformVersionAtLeast`, see sapphire_platform/build.rs) and only release links failed.
      - name: Build for device (release)
        run: cargo build --package sapphire_sandbox --package game_app --target aarch64-apple-ios --release --locked
      # The simulator builds the development configuration (`dev`: the debug overlay, live link,
      # and hot reload without its desktop file watcher), which the M1 exit run's simulator leg
      # runs (review BC-002); the device build above stays the shipping one, without it.
      - name: Build for simulator (dev)
        run: cargo build --package sapphire_sandbox --package game_app --target aarch64-apple-ios-sim --features dev --locked

  mobile-build-android:
    name: Mobile build (Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # xtask runs Gradle offline unless this is set; the runner's Gradle cache starts empty.
      SAPPHIRE_GRADLE_ONLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (job targets)
        uses: ./.github/actions/setup-rust
        with:
          group: android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          env-vars: ${{ env.RUST_CACHE_ENV_VARS }}
          save-if: ${{ env.SAVE_RUST_CACHE }}
      # Validates the committed Gradle wrapper and caches Gradle's downloads. The basic
      # (MIT) cache provider: the default one is proprietary and a preview for private repos.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      # xtask owns the NDK environment, the cdylib build, the mobile cook and the Gradle
      # build (spec §7.3). The image provides the SDK (ANDROID_HOME), JDK 17 and NDK r29.
      # Its default ANDROID_NDK_HOME is r27, older than the r28+ that 16 KB page alignment
      # needs (spec §6.7), so point at the preinstalled r29 that local builds use.
      - name: Bundle the APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" JAVA_HOME="$JAVA_HOME_17_X64"
          cargo --locked xtask --locked bundle --platform android
      # The game's APK from the same project, with its own identity and its own Gradle outputs. The
      # engine's crates and the cook are built by now, so this adds the game's crates and a Gradle run.
      - name: Bundle the game's APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" JAVA_HOME="$JAVA_HOME_17_X64"
          cargo --locked xtask --locked bundle --app game_app --platform android
      # The development configuration as well (live link, and hot reload without the desktop file
      # watcher), which the M1 exit run's emulator and phone legs run (review BC-002). The cook is
      # cached by now, so this adds the dev library and a Gradle run.
      - name: Bundle the APK (dev)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" JAVA_HOME="$JAVA_HOME_17_X64"
          cargo --locked xtask --locked bundle --platform android --features dev
