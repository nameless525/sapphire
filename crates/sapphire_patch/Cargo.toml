[package]
name = "sapphire_patch"
description = "Patches: plans what a new release lacks by hash, fetches it by range on a thread of its own and resumes after a kill, then installs it beside the current release and switches by one durable rename."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
rustls.workspace = true
# The release manifest, which says what a release is, and the packs' tables, which name their blocks.
sapphire_assets.workspace = true
# The staged manifest's durable write, and the OS that picks the TLS roots.
sapphire_platform.workspace = true
# How fast a body comes (`Timeouts::min_rate`).
sapphire_time.workspace = true
thiserror.workspace = true
tracing.workspace = true

# TLS roots (m4-plan §3 "HTTP", and the orchestrator's decision on P0's questions): the OS's own verifier
# everywhere but Android, whose half of `rustls-platform-verifier` needs a Kotlin AAR from outside the crate;
# Android trusts Mozilla's roots, compiled in. Integrity never rests on TLS: the signed manifest and every
# block's hash carry it. `HttpTransport` asks `sapphire_platform::Os` for the same choice, so no
# `cfg(target_os)` is needed here.
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { workspace = true, features = ["platform-verifier"] }
[target.'cfg(target_os = "android")'.dependencies]
ureq = { workspace = true, features = ["rustls-webpki-roots"] }

[dev-dependencies]
# Tests sign manifests with keys from fixed seeds.
ed25519-dalek = { workspace = true, features = ["zeroize"] }
# The TLS test's own certificate, made when it runs and never kept.
rcgen.workspace = true

# Its own `main` plays both sides: the test that kills, and the patcher it kills.
[[test]]
name = "kill"
harness = false

# The same for an install: the test that kills, and the installer it kills.
[[test]]
name = "install_kill"
harness = false

[lints]
workspace = true
