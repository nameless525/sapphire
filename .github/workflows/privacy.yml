name: Privacy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test privacy guard and hooks
        run: python3 -m unittest discover -s .github/scripts -p 'test_privacy*.py' -v
      - name: Check proposed tree, new commit identities and historical content
        env:
          # Data enters through environment variables, never interpolated into shell code.
          PRIVACY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PRIVACY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$PRIVACY_BASE" ]; then
            python3 .github/scripts/privacy_guard.py --head "$PRIVACY_HEAD" --base "$PRIVACY_BASE"
          else
            python3 .github/scripts/privacy_guard.py --head "$PRIVACY_HEAD"
          fi
      - name: Check GitHub-generated merge commit as well
        if: github.event_name == 'pull_request'
        env:
          PRIVACY_MERGE: ${{ github.sha }}
          PRIVACY_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/privacy_guard.py --head "$PRIVACY_MERGE" --base "$PRIVACY_BASE"
