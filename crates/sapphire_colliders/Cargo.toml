[package]
name = "sapphire_colliders"
description = "Static collision geometry as plain data: collision groups, the `.colliders.ron` document, its checks and the cooked format, with no physics engine, so the cooker can link it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Cooked data and documents derive `TypePath`, whose derive finds the crate by this name.
bevy_reflect.workspace = true
glam.workspace = true
rkyv.workspace = true
# Rotations authored as an axis and an angle go through `det`, so cooks on different OSes agree.
sapphire_math.workspace = true
sapphire_reflect.workspace = true
sapphire_serialize.workspace = true
serde.workspace = true
thiserror.workspace = true

[lints]
workspace = true
