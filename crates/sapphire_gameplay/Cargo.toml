[package]
name = "sapphire_gameplay"
description = "The headless simulation: a combat world that ticks with no window or GPU, with stable actor IDs, seeded randomness and a state checksum."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Bevy's derive macros find the crate by this name (see sapphire_ecs).
bevy_ecs.workspace = true
profiling.workspace = true
# The allocation counter in the simulation's stats (rule R6).
sapphire_core.workspace = true
sapphire_ecs.workspace = true
sapphire_math.workspace = true
sapphire_moves.workspace = true
# Hit queries sweep through its world.
sapphire_physics.workspace = true
sapphire_time.workspace = true
thiserror.workspace = true
# The state checksum.
xxhash-rust.workspace = true

[dev-dependencies]
# The cooked bytes tests load, as a game would.
sapphire_serialize.workspace = true

[lints]
workspace = true
