[package]
name = "sapphire_sandbox"
description = "Engine sandbox app: the M0 anime character viewer that runs on all five platforms."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The app's identity on every platform is in platform/identity.toml; its version is the package's.

# The library holds the app. Desktop and iOS link it into the `sapphire_sandbox` binary;
# Android builds it as a cdylib (`cargo rustc --crate-type cdylib`, driven by xtask) whose
# exported `SDL_main` SDLActivity calls.
[lib]
path = "src/lib.rs"

[[bin]]
name = "sapphire_sandbox"
path = "src/main.rs"

[dependencies]
# The fight it benches and its goldens draw, and the HUD on it.
game_combat.workspace = true
# `--game`: the game's own show and flow, with no window (M3 G1).
game_flow.workspace = true
# `--progress`: the save `--game` starts over (M3 G1).
sapphire_save.workspace = true
sapphire_serialize.workspace = true
game_ui.workspace = true
sapphire_assets.workspace = true
sapphire_audio.workspace = true
sapphire_camera.workspace = true
sapphire_core = { workspace = true, features = ["mimalloc"] }
sapphire_controls.workspace = true
sapphire_crash.workspace = true
# `--ui-dialogue` (M3 Q2b): a cooked conversation walked onto the dialogue panel.
sapphire_dialogue.workspace = true
# The scene, content and the stage's frame, which this app fills from its flags (M3 S1).
# Every scene its flags build, the sample scenes among them, which a game never names.
sapphire_stage = { workspace = true, features = ["samples"] }
# `--display-text` (M3 U8): shaping, the glyph pages and display faces' fields.
sapphire_text.workspace = true
# `--replay` and `--record`: the simulation beside the renderer (M2 D2).
sapphire_gameplay.workspace = true
sapphire_input.workspace = true
sapphire_jobs.workspace = true
# What the test screens' models derive.
bevy_reflect.workspace = true
sapphire_math.workspace = true
sapphire_moves.workspace = true
sapphire_platform.workspace = true
sapphire_ecs.workspace = true
sapphire_render.workspace = true
sapphire_rhi.workspace = true
sapphire_sequencer.workspace = true
sapphire_time.workspace = true
sapphire_ui.workspace = true
sapphire_world.workspace = true
png.workspace = true
profiling.workspace = true
tracing.workspace = true
# Dev-only (rule R8): linked only by the `dev` feature.
sapphire_debug = { workspace = true, optional = true }
# Hot reload (M1 A8), dev-only too. Its file watching is for desktops alone: see below.
sapphire_hot_reload = { workspace = true, optional = true }
# Live link (M1 A9), dev-only too: pushes from the desktop, on every platform.
sapphire_livelink = { workspace = true, optional = true }

# Desktop dev builds watch files for hot reload, through the crate's `notify` backend. Phones
# get changes from live link (A9) instead, so the watcher stays out of their builds.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
sapphire_hot_reload = { workspace = true, optional = true, features = ["notify"] }

[features]
# Stream profiling zones to the Tracy profiler (spec §5.3).
tracy = ["profiling/profile-with-tracy"]
# Development builds: the debug overlay (spec §5.20), hot reload (spec §5.10) and live link
# (spec §5.29). Shipping builds leave it off.
dev = ["dep:sapphire_debug", "dep:sapphire_hot_reload", "dep:sapphire_livelink", "sapphire_stage/dev", "game_combat/dev", "game_ui/dev"]

[dev-dependencies]
sapphire_colliders.workspace = true
# The test screens' tests build their own string tables.
sapphire_loc.workspace = true
sapphire_look.workspace = true
sapphire_strings.workspace = true
# The fight's flashes, judged by the analyser (`tests/flashes.rs`, M4 Z3c).
sapphire_testkit.workspace = true

[lints]
workspace = true
