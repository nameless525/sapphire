[package]
name = "sapphire_platform"
description = "SDL3-based platform layer: app lifecycle, windows, surfaces, input events, content and user file systems."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# `std` makes `HandleError` a `std::error::Error`, so `?` works on surface handles.
raw-window-handle = { workspace = true, features = ["std"] }
sapphire_core.workspace = true
thiserror.workspace = true
tracing.workspace = true

# SDL 3 is compiled from the vendored `sdl3-src` sources with CMake and linked
# statically on every target, so no platform needs an SDL install, a framework or a
# second shared library (spec §5.1). Building it needs CMake and a C toolchain for the
# target; Linux additionally needs the X11 / Wayland / udev development headers.
#
# Subsystems are opted into explicitly (`no-default-subsystems`) so a new SDL release
# can't silently grow the binary or the platform permission surface:
#
# - kept:    video (windows, events, keyboard / mouse / touch), joystick (which also
#            backs the gamepad API), hidapi (direct drivers for Xbox, PlayStation,
#            Switch and Steam controllers), haptic (rumble), sensor (gamepad and
#            device motion).
# - dropped: render and gpu (wgpu owns the GPU through sapphire_rhi), audio (kira on cpal
#            owns audio from M2; nothing in SDL needs its audio subsystem), camera, dialog
#            and tray (no use in a game; the dialog and tray backends would also pull
#            in portal / GTK dependencies on Linux), power (battery state isn't exposed
#            until the thermal and power work in M4).
sdl3-sys = { workspace = true, features = [
    "build-from-source-static",
    "no-default-subsystems",
    "sdl-video",
    "sdl-joystick",
    "sdl-hidapi",
    "sdl-haptic",
    "sdl-sensor",
] }

# iOS frame pacing (M1 F7, ADR 0003): the engine's CADisplayLink, which drives SDL's main
# callbacks at the target frame rate, and the Objective-C class it calls.
[target.'cfg(target_os = "ios")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSRunLoop", "NSString", "NSNotification", "NSDictionary", "NSValue", "NSOperation", "NSError", "NSProcessInfo", "block2"] }
# The audio session (M2 E1, `audio_session.rs`), which cpal's iOS host expects an app to set up.
objc2-avf-audio.workspace = true
block2.workspace = true
objc2-quartz-core = { workspace = true, features = ["objc2-core-foundation", "CADisplayLink", "CAFrameRateRange"] }

# Android frame pacing (M1 F8, ADR 0004): `CLOCK_MONOTONIC`, the choreographer's clock, and
# resolving the NDK functions newer than the app's minimum API level at run time.
[target.'cfg(target_os = "android")'.dependencies]
libc.workspace = true
# What cpal's AAudio host reads the app's VM and activity through (M2 E1, `audio_session.rs`).
jni-sys.workspace = true
ndk-context.workspace = true

[dev-dependencies]
# The lifecycle test injects raw SDL events to exercise re-entrant dispatch.
sdl3-sys.workspace = true
# The smoke example plays the app's role of wiring `tracing` to stderr / `sdl_log`.
tracing-subscriber.workspace = true

# `platform_smoke` as the library an Android activity loads; empty on other targets.
[[example]]
name = "platform_smoke_android"
crate-type = ["cdylib"]

# Drives SDL's real callback loop, which must own the process's main thread.
[[test]]
name = "lifecycle"
harness = false

# Pushes SDL events from worker threads, so it needs that same real loop.
[[test]]
name = "worker_events"
harness = false

[lints]
workspace = true
